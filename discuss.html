<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>課堂討論｜AI 課堂</title>

  <script src="config.js"></script>
  <script src="gas-bridge.js"></script>
  <script src="teacher-auth.js"></script>
  <script src="teacher-course.js"></script>

  <link rel="stylesheet" href="theme.css">
  <script src="features.js"></script>
  <script src="shell.js" defer></script>

  <style>
    :root { --lane: #e4e9f0; }

    body.no-scroll { overflow: hidden; }

    button {
      border: 1px solid transparent;
      border-radius: var(--radius-s);
      padding: 8px 14px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: filter .15s;
    }

    button:hover { filter: brightness(.92); }
    button:disabled { opacity: .5; cursor: not-allowed; filter: none; }

    .green  { background: var(--green); }
    .red    { background: var(--red); }
    .gray   { background: var(--gray); }
    .orange { background: var(--orange); }
    .purple { background: var(--purple); }
    .yellow { background: var(--yellow); color: var(--head); font-weight: 700; }
    .light  { background: var(--head-2); border-color: rgba(255, 255, 255, .14); }
    .ghost  { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
    .mini   { padding: 4px 9px; font-size: 13px; }

    /* ---------- 頁首工具列 ---------- */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      padding: 14px 18px;
      margin-bottom: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: sticky;
      top: 12px;
      z-index: 20;
    }

    .topbar h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 900;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: .02em;
    }

    .topbar-title { margin-right: 6px; }

    .topbar-course {
      display: block;
      max-width: 16em;
      overflow: hidden;
      color: var(--ink-2);
      font-size: 13px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .topbar select {
      height: 40px;
      padding: 0 10px;
      border-radius: var(--radius-s);
      border: 1px solid var(--line-strong);
      font: inherit;
      font-size: 15px;
      flex: 1 1 260px;
      max-width: 420px;
      background: var(--surface);
      color: var(--ink);
    }

    .topbar-options { display: flex; flex-wrap: wrap; gap: 6px 16px; }
    .topbar-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
    .topbar-buttons button { height: 40px; white-space: nowrap; }

    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--ink-2);
      cursor: pointer;
      white-space: nowrap;
    }

    .toggle:hover { color: var(--ink); }
    .toggle input { width: 16px; height: 16px; accent-color: var(--blue); }

    .toggle.auto-classify { color: var(--ink); font-weight: 700; }
    .toggle.auto-classify input { accent-color: var(--green); }

    .auto-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
    }

    .auto-status.waiting { background: var(--orange-soft); color: var(--orange); }

    /* ---------- 看板＋右側工具面板 ---------- */
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 20px;
      align-items: start;
    }

    body.tools-hidden .workspace { grid-template-columns: minmax(0, 1fr); }
    body.tools-hidden .tools-panel { display: none; }

    .board-area { min-width: 0; }

    .tools-panel {
      position: sticky;
      top: 96px;
      max-height: calc(100vh - 110px);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .tools-panel .line-tabs { margin: 0; padding: 0 18px; gap: 22px; flex: none; }
    .tools-panel .line-tabs button { font-size: 15px; padding: 12px 2px; }

    .tools-body { overflow-y: auto; padding: 16px 18px 20px; }
    .tools-body [hidden] { display: none !important; }
    .tools-body h3 { margin: 0 0 4px; font-size: 17px; }

    .present-bar {
      display: none;
      position: fixed;
      right: 18px;
      top: 14px;
      z-index: 30;
      gap: 8px;
    }

    /* ---------- 版面 ---------- */
    .container { padding: 20px 24px 64px; max-width: none; margin: 0; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 24px;
      margin-bottom: 18px;
    }

    .question-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .question-head h2 { margin: 0; font-family: var(--serif); font-size: 24px; }

    .badge {
      display: inline-block;
      padding: 2px 11px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 13px;
      font-weight: 500;
    }

    .question-content {
      white-space: pre-wrap;
      line-height: 1.85;
      margin: 12px 0 0;
      font-size: 17px;
      max-width: 60em;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--ink-2);
      font-size: 14px;
    }

    .stats:empty { display: none; }
    .stats b { color: var(--ink); font-size: 17px; }


    .hint { color: var(--ink-2); font-size: 14px; line-height: 1.75; margin: 4px 0 8px; }

    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .button-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .button-stack button { text-align: left; padding: 10px 14px; }

    .message { margin-top: 10px; font-size: 14px; font-weight: 700; min-height: 1.4em; line-height: 1.6; }
    .message.success { color: var(--green); }
    .message.error { color: var(--red); }
    .message.warn { color: var(--orange); }
    .message.info { color: var(--blue); }

    .error-message { color: var(--red); font-weight: 700; }
    .empty { text-align: center; color: var(--ink-2); padding: 30px; }

    /* ---------- 類別編輯 ---------- */
    .editor-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-s);
      margin-top: 8px;
      background: var(--surface-2);
    }

    .color-dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 12px; flex: 0 0 14px; }
    .editor-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }

    .editor-fields input, .editor-fields textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-s);
      background: var(--surface);
      font: inherit;
      font-size: 15px;
      color: var(--ink);
    }

    .editor-fields input:focus, .editor-fields textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .editor-fields input { font-weight: 700; }
    .editor-fields textarea { min-height: 54px; resize: vertical; line-height: 1.6; }
    .editor-actions { display: flex; flex-direction: column; gap: 4px; }

    /* ---------- 看板 ---------- */
    .board-hint { color: var(--ink-2); font-size: 14px; margin: 4px 0 12px; }

    .board {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      align-items: flex-start;
      padding: 2px 2px 16px;
    }

    .column {
      flex: 0 0 310px;
      background: var(--lane);
      border-radius: var(--radius);
      border-top: 6px solid var(--col);
      padding: 12px;
      outline: 2px dashed transparent;
      outline-offset: -2px;
    }

    .column.solo { flex: 1 1 auto; }

    .column.solo .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    .column.solo .answer-card { margin-top: 0; }
    .column.drag-over { outline-color: var(--blue); background: #dfe7fb; }

    .column-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .column-title span:first-child { font-weight: 700; font-size: 17px; }

    .count {
      background: var(--surface);
      border-radius: 999px;
      padding: 1px 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--col);
    }

    .column-desc { color: var(--ink-2); font-size: 13px; line-height: 1.6; margin-top: 4px; }
    .column-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

    .summary-box {
      background: var(--surface);
      border-radius: var(--radius-s);
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.75;
    }

    .discussion-q { margin-top: 6px; color: #7a5200; }

    .answer-card {
      background: var(--surface);
      border-radius: var(--radius-s);
      padding: 12px 12px 10px;
      margin-top: 10px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      border-left: 5px solid var(--line-strong);
      cursor: grab;
    }

    .answer-card.ai { border-left-color: var(--orange); }
    .answer-card.confirmed { border-left-color: var(--green); }
    .answer-card.representative { box-shadow: 0 0 0 2px var(--yellow); }
    .answer-card.dragging { opacity: .4; }

    /* 跨類別：在其他類別裡顯示一張「也屬於」的副本 */
    .answer-card.also { border-left-style: dashed; background: var(--surface-2, #f6f4ef); cursor: default; }
    .also-label { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
    .label-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .label-chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; color: #fff; background: var(--chip, #7d8899); }
    .cross-tag { font-size: 12px; font-weight: 700; color: #6446c0; }

    /* 標籤編輯視窗 */
    .label-dialog { border: none; border-radius: var(--radius); padding: 0; width: min(440px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(16, 24, 40, .3); }
    .label-dialog::backdrop { background: rgba(16, 24, 40, .45); }
    .label-dialog form { padding: 20px 22px; }
    .label-dialog h3 { margin: 0 0 4px; font-size: 18px; }
    .label-dialog .preview { margin: 8px 0 12px; padding: 8px 10px; background: var(--surface-2, #f6f4ef); border-radius: 8px; font-size: 14px; max-height: 120px; overflow: auto; white-space: pre-wrap; }
    .label-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
    .label-row input { width: auto; margin: 0; }
    .label-row .main { font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 4px; align-items: center; }
    .label-row .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--chip); }
    .label-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }

    /* ---------- 統計圖 ---------- */
    .charts { margin-top: 16px; }
    .charts[hidden] { display: none !important; }
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
    .chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
    .chart-card h3 { margin: 0; font-size: 16px; }
    .chart-card .chart-sub { margin: 2px 0 10px; font-size: 13px; color: var(--ink-2); }
    .chart-card svg { width: 100%; height: auto; display: block; overflow: visible; }
    .chart-card svg text { font-family: inherit; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
    .chart-legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; background: var(--chip); vertical-align: -1px; }
    .chart-legend .hatch::before { background: repeating-linear-gradient(45deg, var(--ink-2) 0 2px, transparent 2px 5px); border: 1px solid var(--ink-2); }
    .chart-empty { color: var(--ink-2); font-size: 14px; padding: 20px 0; }
    .mix { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 12px; font-size: 15px; }
    .mix b { font-size: 20px; margin-left: 4px; }
    body.present .chart-card h3 { font-size: 20px; }

    .rep-label { font-size: 12px; font-weight: 700; color: #8a6200; margin-bottom: 4px; }
    .answer-text { white-space: pre-wrap; line-height: 1.75; word-break: break-word; }

    .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; }
    .student { color: var(--ink-2); }

    .tag { border-radius: 999px; padding: 1px 8px; font-size: 12px; }
    .tag.ai { background: var(--orange-soft); color: var(--orange); }
    .tag.ok { background: var(--green-soft); color: var(--green); }

    .reason { font-size: 12px; color: var(--ink-2); margin-top: 6px; line-height: 1.5; }
    .student-reply.agree { color: var(--green-dark, #1f6b45); }
    .student-reply.disagree { color: var(--orange, #c2410c); font-weight: 700; }

    .card-controls { display: flex; gap: 6px; margin-top: 8px; }

    .card-controls select {
      flex: 1;
      min-width: 0;
      padding: 5px;
      border-radius: 6px;
      border: 1px solid var(--line-strong);
      font: inherit;
      font-size: 13px;
      background: var(--surface);
    }

    .card-controls button { flex: 0 0 auto; }

    .drop-hint {
      border: 2px dashed var(--line-strong);
      border-radius: var(--radius-s);
      padding: 18px;
      text-align: center;
      color: var(--ink-2);
      font-size: 13px;
      margin-top: 10px;
    }

    /* ---------- 投影模式 ---------- */
    body.present .teacher-only { display: none !important; }
    body.present .workspace { grid-template-columns: minmax(0, 1fr); }
    body.present .shell-side, body.present .shell-bar { display: none; }
    body.present.has-shell { padding-left: 0; }
    body.present .present-bar { display: flex; }
    body.present .container { padding-top: 24px; }
    body.present .question-content { font-size: 24px; }
    body.present .question-head h2 { font-size: 30px; }
    body.present .column { flex-basis: 380px; }
    body.present .column-title span:first-child { font-size: 22px; }
    body.present .answer-text { font-size: 19px; }
    body.present .summary-box { font-size: 17px; }
    body.present .answer-card { cursor: default; }

    /* ---------- 聚焦討論 ---------- */
    .focus-overlay {
      position: fixed;
      inset: 0;
      background: var(--head);
      color: #fff;
      z-index: 100;
      overflow: auto;
      display: none;
    }

    .focus-overlay.open { display: block; }
    .focus-inner { max-width: 1200px; margin: auto; padding: 24px 32px 60px; }
    .focus-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .focus-question { opacity: .72; margin: 18px 0 8px; white-space: pre-wrap; font-size: 18px; line-height: 1.7; }

    .focus-title {
      font-family: var(--serif);
      font-size: 40px;
      margin: 14px 0 6px;
      border-left: 10px solid var(--col);
      padding-left: 16px;
    }

    .focus-title small { font-family: var(--sans); font-size: 20px; opacity: .7; font-weight: normal; margin-left: 10px; }
    .focus-desc { font-size: 18px; opacity: .8; margin: 6px 0 14px 26px; }

    .focus-summary, .focus-discussion {
      font-size: 23px;
      line-height: 1.7;
      background: rgba(255, 255, 255, .08);
      border-radius: var(--radius);
      padding: 14px 20px;
      margin: 10px 0;
    }

    .focus-discussion { background: rgba(242, 194, 48, .2); }

    .focus-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .focus-card {
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius);
      padding: 16px 18px;
      font-size: 20px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .focus-card.representative { box-shadow: 0 0 0 4px var(--yellow); }
    .focus-card .student { display: block; font-size: 15px; margin-top: 8px; }

    @media (max-width: 1200px) {
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .tools-panel { position: static; max-height: none; order: -1; }
    }

    @media (max-width: 900px) {
      .topbar { position: static; }
      .topbar-title { flex-basis: 100%; }
      .topbar-course { max-width: none; }
      .topbar-buttons { margin-left: 0; width: 100%; }
      .topbar-buttons button { flex: 1 1 auto; }
      .container { padding: 16px 12px 60px; }
      .column { flex-basis: 270px; }
    }
  </style>
</head>

<body data-shell-collapsed="true">

<div class="present-bar">
  <button type="button" class="ghost" onclick="togglePresent()">✕ 離開投影模式</button>
</div>

<main class="container">

  <header class="topbar teacher-only">
    <div class="topbar-title">
      <h1>課堂討論</h1>
      <span class="topbar-course" id="courseName"></span>
    </div>

    <select id="questionSelect" aria-label="選擇題目" onchange="changeQuestion()">
      <option value="">載入中……</option>
    </select>

    <div class="topbar-options">
      <label class="toggle"><input type="checkbox" id="showNames" onchange="rerender()"> 顯示姓名</label>
      <label class="toggle"><input type="checkbox" id="confirmedOnly" onchange="rerender()"> 只顯示已確認的分類</label>
      <label class="toggle"><input type="checkbox" id="autoRefresh" checked onchange="setupAutoRefresh()"> 每 10 秒自動更新</label>
      <label class="toggle auto-classify" title="學生送出後，AI 自動把回答分到類別並標成已確認">
        <input type="checkbox" id="autoClassifyToggle" onchange="toggleAutoClassify()" disabled> 自動分類並確認
      </label>
    </div>

    <div class="topbar-buttons">
      <button type="button" class="ghost" onclick="loadBoard(false)">🔄 重新整理</button>
      <button type="button" class="ghost" id="toolsToggle" aria-pressed="false">收起工具面板</button>
      <button type="button" class="ghost" id="chartsToggle" aria-pressed="false" onclick="toggleCharts()">📊 統計圖</button>
      <button type="button" class="yellow" onclick="togglePresent()">📽 投影模式</button>
    </div>
  </header>

  <section class="card">
    <div id="questionInfo"><div class="empty">載入中……</div></div>
    <div id="stats" class="stats"></div>
  </section>

  <section class="charts" id="charts" hidden aria-label="分類統計圖"></section>

  <div class="workspace">

    <div class="board-area">
      <p class="board-hint teacher-only">
        把卡片拖到其他類別，或用卡片下方的選單移動。按「聚焦討論」可以放大單一類別，方便投影帶討論。
      </p>
      <section id="board" class="board"></section>
    </div>

    <aside class="tools-panel teacher-only" aria-label="教師工具">

      <div class="line-tabs" role="tablist">
        <button type="button" role="tab" id="toolTabCategories" aria-controls="toolCategories" aria-selected="true">設定類別</button>
        <button type="button" role="tab" id="toolTabAI" aria-controls="toolAI" aria-selected="false">AI 分類與整理</button>
      </div>

      <div class="tools-body">

        <div id="toolCategories" role="tabpanel" aria-labelledby="toolTabCategories">
          <p class="hint">
            類別名稱會投影給全班看，建議使用中性的描述，例如「以速度來解釋」，避免「錯誤觀念」這類字眼。
          </p>

          <div id="categoryEditor"></div>

          <div class="button-row">
            <button type="button" class="gray ai-action" onclick="addCategoryRow()">＋ 新增類別</button>
            <button type="button" class="purple ai-action" onclick="suggestCategories()">🤖 讓 AI 建議類別</button>
            <button type="button" class="purple ai-action" onclick="suggestFromObjective()" title="還沒有學生回答也可以用：依題目的學習目標預先設計類別">🎯 依學習目標建議</button>
            <button type="button" class="green ai-action" onclick="saveCategories()">儲存類別</button>
          </div>

          <div id="editorMessage" class="message"></div>
        </div>

        <div id="toolAI" role="tabpanel" aria-labelledby="toolTabAI" hidden>
          <p class="hint">
            卡片左邊是橘色代表「AI 建議」，教師移動卡片或按 ✓ 之後會變成綠色「已確認」。
            重新分類時，已確認的卡片不會被改動。
          </p>

          <div class="button-stack">
            <button type="button" class="green ai-action" onclick="runAutoNow()">⚡ 立即自動分類並確認</button>
            <button type="button" class="ai-action" onclick="classifyUnclassified()">🤖 分類尚未分類的回答</button>
            <button type="button" class="orange ai-action" onclick="reclassifyUnconfirmed()">🔄 重新分類未確認的回答</button>
            <button type="button" class="green ai-action" onclick="confirmAll()">✓ 全部標為已確認</button>
            <button type="button" class="purple ai-action" onclick="summarize()">📝 產生類別摘要與討論提問</button>
          </div>

          <div id="aiMessage" class="message"></div>
        </div>

      </div>
    </aside>

  </div>

</main>

<div id="focusOverlay" class="focus-overlay" role="dialog" aria-modal="true"></div>

<dialog class="label-dialog" id="labelDialog" aria-labelledby="labelTitle">
  <form method="dialog" onsubmit="return false">
    <h3 id="labelTitle">這份回答屬於哪幾類？</h3>
    <p class="hint" style="margin:0">一份回答可以同時屬於多個類別（最多 3 個）。標「主要」的那一類，卡片會放在那一欄。</p>
    <div class="preview" id="labelPreview"></div>
    <div id="labelRows"></div>
    <div class="label-actions">
      <button type="button" class="ghost" onclick="$('labelDialog').close()">取消</button>
      <button type="button" class="green" id="labelSave" onclick="saveLabels()">儲存</button>
    </div>
  </form>
</dialog>


<script>

  const PALETTE = [
    '#2f5bd3', '#1c7a52', '#b35f0c', '#6446c0', '#c0392b',
    '#1b7f9e', '#a8487f', '#557a1c', '#9a6a10', '#475c75'
  ];

  const UNCLASSIFIED_COLOR = '#7d8899';

  const state = {
    questionId: '',
    board: null,
    signature: '',
    editorCats: [],
    editorDirty: false,
    busy: false,
    dragging: false,
    pendingOps: 0,
    present: false,
    timer: null,
    focusCategoryId: null,
    requestSeq: 0,
    lastLoadedAt: ''
  };


  function $(id) {
    return document.getElementById(id);
  }


  document.addEventListener('DOMContentLoaded', function() {

    setupDragAndDrop();
    setupAutoRefresh();

    document.addEventListener('keydown', handleKeydown);

    window.addEventListener('beforeunload', function(event) {
      if (state.editorDirty) {
        event.preventDefault();
        event.returnValue = '';
      }
    });

    // 切換課程前，提醒還沒儲存的類別
    window.TeacherCourseBeforeChange = function() {
      if (state.editorDirty && !confirm('類別設定還沒儲存，切換課程會放棄這些修改。確定要切換嗎？')) {
        return false;
      }
      state.editorDirty = false; // 已經確認過，不要再跳出離開頁面的提醒
      return true;
    };

    // 登入、讀到目前課程之後才載入資料
    TeacherCourse.ready(function(ctx) {

      // 左側選單在這一頁預設收合，所以在標題下方標出目前課程
      $('courseName').textContent = ctx.course ? ctx.course.name : '還沒有課程';
      $('courseName').title = ctx.course ? '目前課程：' + ctx.course.name : '';


      google.script.url.getLocation(function(location) {

        const preferred =
          location && location.parameter && location.parameter.questionId
            ? location.parameter.questionId
            : '';

        loadQuestionList(preferred);
      });
    });
  });


  function categoryName(id) {
    const c = (state.board && state.board.categories || []).find(function(x) { return x.id === id; });
    return c ? c.name : '已刪除的類別';
  }


  /* ==================================================
     題目與資料載入
  ================================================== */

  // 上次有打開統計圖就維持打開
  try {
    if (localStorage.getItem('aiclassroom_discuss_charts') === '1') {
      document.addEventListener('DOMContentLoaded', function() { if ($('charts').hidden) toggleCharts(); });
    }
  } catch (error) { /* 忽略 */ }


  function loadQuestionList(preferredId) {

    google.script.run
      .withSuccessHandler(function(questions) {

        const select = $('questionSelect');
        select.innerHTML = '';

        if (!questions || !questions.length) {
          select.innerHTML = '<option value="">（目前沒有題目）</option>';
          $('questionInfo').innerHTML = '<div class="empty">這門課程還沒有題目，請先到教師系統新增。</div>';
          return;
        }

        questions.forEach(function(q) {
          const option = document.createElement('option');
          option.value = q.id;
          option.textContent = q.title + '（' + q.status + '，' + q.answerCount + ' 份回答）';
          select.appendChild(option);
        });

        const exists = questions.some(function(q) {
          return q.id === preferredId;
        });

        select.value = exists ? preferredId : questions[0].id;
        state.questionId = select.value;

        loadBoard(false);
      })
      .withFailureHandler(function(error) {
        $('questionInfo').innerHTML =
          '<div class="error-message">題目讀取失敗：' + escapeHtml(error.message) + '</div>';
      })
      .getTeacherQuestions(TeacherCourse.id());
  }


  function changeQuestion() {

    const select = $('questionSelect');

    if (
      state.editorDirty &&
      !confirm('類別設定還沒儲存，切換題目會放棄這些修改。確定要切換嗎？')
    ) {
      select.value = state.questionId;
      return;
    }

    state.questionId = select.value;
    state.board = null;
    state.signature = '';
    state.editorDirty = false;
    state.editorCats = [];

    closeFocus();
    showMessage('editorMessage', '', '');
    showMessage('aiMessage', '', '');

    loadBoard(false);
  }


  function loadBoard(silent) {

    if (!state.questionId) {
      return;
    }

    const seq = ++state.requestSeq;
    const questionId = state.questionId;

    if (!state.board) {
      $('board').innerHTML = '<div class="empty">載入中……</div>';
    }

    google.script.run
      .withSuccessHandler(function(board) {

        // 只採用最新一次的請求結果，並且不打斷正在進行的拖曳或移動
        if (seq !== state.requestSeq || questionId !== state.questionId) return;
        if (state.pendingOps > 0 || state.dragging) return;

        if (!board || !board.question) {
          state.board = null;
          $('questionInfo').innerHTML = '<div class="error-message">找不到這個題目，可能已經被刪除。</div>';
          $('stats').innerHTML = '';
          $('board').innerHTML = '';
          return;
        }

        state.lastLoadedAt = new Date().toLocaleTimeString('zh-TW', { hour12: false });

        const signature = JSON.stringify(board);

        if (signature === state.signature) {
          renderStats();
          return;
        }

        state.signature = signature;
        state.board = board;

        renderAll();
      })
      .withFailureHandler(function(error) {

        if (seq !== state.requestSeq) return;

        if (!silent || !state.board) {
          $('board').innerHTML =
            '<div class="error-message">讀取失敗：' + escapeHtml(error.message) + '</div>';
        }
      })
      .getDiscussionBoard(questionId);
  }


  function setupAutoRefresh() {

    if (state.timer) {
      clearInterval(state.timer);
      state.timer = null;
    }

    if (!$('autoRefresh').checked) {
      return;
    }

    state.timer = setInterval(function() {

      if (
        document.hidden ||
        state.busy ||
        state.dragging ||
        state.pendingOps > 0 ||
        isUsingBoardControl()
      ) {
        return;
      }

      loadBoard(true);
    }, 10000);
  }


  function isUsingBoardControl() {

    const el = document.activeElement;

    return !!(el && el.tagName === 'SELECT' && el.closest('#board'));
  }


  /* ==================================================
     畫面
  ================================================== */

  function renderAll() {

    renderQuestionInfo();

    if (!state.editorDirty) {
      state.editorCats = state.board.categories.map(function(c) {
        return { id: c.id, name: c.name, description: c.description };
      });
      renderEditor();
    }

    renderStats();
    renderBoard();
    renderFocus();
    renderCharts();
  }


  function rerender() {

    if (!state.board) {
      return;
    }

    renderBoard();
    renderFocus();
    renderCharts();
  }


  function renderQuestionInfo() {

    const q = state.board.question;

    $('questionInfo').innerHTML = `
      <div class="question-head">
        <h2>${escapeHtml(q.title)}</h2>
        <span class="badge teacher-only">${escapeHtml(q.status)}</span>
      </div>
      <div class="question-content">${escapeHtml(q.content)}</div>
    `;
  }


  function renderStats() {

    if (!state.board) {
      return;
    }

    const answers = state.board.answers;

    const classified = answers.filter(function(a) { return a.classified; }).length;
    const confirmed = answers.filter(function(a) { return a.confirmed; }).length;
    const cross = answers.filter(function(a) { return a.categoryId && (a.extraCategoryIds || []).length; }).length;

    $('stats').innerHTML = `
      <span>回答 <b>${answers.length}</b></span>
      <span>類別 <b>${state.board.categories.length}</b></span>
      <span class="teacher-only">已分類 <b>${classified}</b></span>
      <span class="teacher-only">已確認 <b>${confirmed}</b></span>
      ${cross ? `<span>跨類別 <b>${cross}</b></span>` : ''}
      <span class="teacher-only">更新時間 ${escapeHtml(state.lastLoadedAt)}</span>
      ${autoStatusHtml()}
    `;

    const toggle = $('autoClassifyToggle');

    if (toggle && !state.autoBusy) {
      toggle.disabled = false;
      toggle.checked = !!state.board.question.autoClassify;
    }
  }


  function autoStatusHtml() {

    const q = state.board && state.board.question;

    if (!q || !q.autoClassify) {
      return '';
    }

    if (q.autoWaiting > 0) {
      return '<span class="auto-status waiting teacher-only">🤖 自動分類：再 ' + escapeHtml(q.autoWaiting) +
        ' 份回答就會自動建立類別</span>';
    }

    return '<span class="auto-status teacher-only">🤖 自動分類中：新回答約 1 分鐘內會分好並確認</span>';
  }


  /* ==================================================
     自動分類（學生送出後由背景工作處理）
  ================================================== */

  function toggleAutoClassify() {

    const toggle = $('autoClassifyToggle');
    const on = toggle.checked;
    const questionId = state.questionId;

    if (!questionId) {
      toggle.checked = false;
      return;
    }

    if (on && !confirm('開啟後，AI 會把這一題的回答自動分到類別並直接標成「已確認」，之後新的回答也會自動處理。\n\n還沒有類別時，滿 5 份回答會自動建立類別。你隨時可以拖動卡片調整，或再關掉。\n\n要開啟嗎？')) {
      toggle.checked = false;
      return;
    }

    state.autoBusy = true;
    toggle.disabled = true;
    setBusy(true, on ? '開啟自動分類，正在處理現有的回答……' : '關閉自動分類……', 'aiMessage');
    // 切到「AI 分類與整理」分頁，讓老師看到處理進度；工具面板收起時先打開
    if (document.body.classList.contains('tools-hidden')) $('toolsToggle').click();
    $('toolTabAI').click();

    google.script.run
      .withSuccessHandler(function(result) {
        state.autoBusy = false;
        setBusy(false);
        showMessage('aiMessage', autoResultText(result, on), 'success');
        if (questionId === state.questionId) loadBoard(true);
      })
      .withFailureHandler(function(error) {
        state.autoBusy = false;
        setBusy(false);
        toggle.disabled = false;
        toggle.checked = !on;
        showMessage('aiMessage', autoErrorText(error), 'error');
      })
      .setQuestionAutoClassify(questionId, on);
  }


  function runAutoNow() {

    if (!state.questionId) return;

    const questionId = state.questionId;

    setBusy(true, '自動分類中……', 'aiMessage');

    google.script.run
      .withSuccessHandler(function(result) {
        setBusy(false);
        showMessage('aiMessage', autoResultText(result, true), 'success');
        if (questionId === state.questionId) loadBoard(true);
      })
      .withFailureHandler(function(error) {
        setBusy(false);
        showMessage('aiMessage', autoErrorText(error), 'error');
      })
      .runAutoClassifyNow(questionId);
  }


  function autoResultText(result, on) {

    result = result || {};

    if (!on) return '已關閉自動分類。';
    if (result.busy) return '系統正在處理這一題，稍後會自動更新。';
    if (result.waiting) return '已開啟。還沒有類別，再 ' + result.waiting + ' 份回答就會自動建立；也可以在「設定類別」先自己設定。';

    return (result.created ? '已自動建立 ' + result.created + ' 個類別，' : '') +
      (result.processed ? '分類並確認了 ' + result.processed + ' 份回答。' : '目前沒有需要分類的回答。') +
      (result.remaining ? '還有一些沒處理完，背景會繼續。' : '');
  }


  function autoErrorText(error) {
    return /不允許呼叫的功能/.test(error.message)
      ? '自動分類要等 Apps Script 換上新版 Code.gs 並部署後才能使用。'
      : '自動分類失敗：' + error.message;
  }


  function colorFor(index) {
    return PALETTE[index % PALETTE.length];
  }


  function getColumns() {

    const board = state.board;
    const confirmedOnly = $('confirmedOnly').checked;
    const map = {};

    const columns = board.categories.map(function(c, index) {

      const column = {
        id: c.id,
        name: c.name,
        description: c.description,
        summary: c.summary,
        discussionQuestion: c.discussionQuestion,
        representativeAnswerId: c.representativeAnswerId,
        color: colorFor(index),
        answers: [],
        also: [],
        isUnclassified: false
      };

      map[c.id] = column;

      return column;
    });

    const unclassified = {
      id: '',
      name: confirmedOnly ? '未分類／待確認' : '未分類',
      description: '',
      summary: '',
      discussionQuestion: '',
      representativeAnswerId: '',
      color: UNCLASSIFIED_COLOR,
      answers: [],
      also: [],
      isUnclassified: true
    };

    board.answers.forEach(function(a) {

      let target =
        a.categoryId && map[a.categoryId] ? map[a.categoryId] : unclassified;

      if (confirmedOnly && !a.confirmed) {
        target = unclassified;
      }

      target.answers.push(a);

      // 跨類別：在其他類別也放一張副本
      if (target !== unclassified) {
        (a.extraCategoryIds || []).forEach(function(id) {
          if (map[id]) map[id].also.push(a);
        });
      }
    });

    // 代表回答排在最前面
    columns.forEach(function(column) {
      column.answers.sort(function(a, b) {
        return (
          (b.answerId === column.representativeAnswerId) -
          (a.answerId === column.representativeAnswerId)
        );
      });
    });

    columns.push(unclassified);

    return columns;
  }


  function renderBoard() {

    const boardEl = $('board');

    if (!state.board) {
      return;
    }

    if (!state.board.answers.length) {
      boardEl.innerHTML = '<div class="card empty" style="flex:1">這一題還沒有學生回答。學生送出後，這裡會自動出現。</div>';
      return;
    }

    const columns = getColumns().filter(function(column) {
      return !(
        column.isUnclassified &&
        !column.answers.length &&
        (state.present || state.board.categories.length === 0)
      );
    });

    const solo = columns.length === 1;

    boardEl.innerHTML = columns
      .map(function(column) {
        return renderColumn(column, solo);
      })
      .join('');
  }


  function renderColumn(column, solo) {

    const hasSummary = column.summary || column.discussionQuestion;

    return `
      <div class="column ${solo ? 'solo' : ''}"
           data-category-id="${escapeHtml(column.id)}"
           style="--col:${column.color}">

        <div class="column-title">
          <span>${escapeHtml(column.name)}</span>
          <span class="count" title="${column.also.length ? '其中 ' + column.also.length + ' 份主要在其他類別' : ''}">${column.answers.length + column.also.length}</span>
        </div>

        ${column.description ? `<div class="column-desc">${escapeHtml(column.description)}</div>` : ''}

        ${
          column.isUnclassified
            ? ''
            : `<div class="column-buttons">
                 <button type="button" class="mini ghost" onclick="openFocus('${column.id}')">🔍 聚焦討論</button>
                 <button type="button" class="mini ghost teacher-only" onclick="confirmCategory('${column.id}')">✓ 確認這一類</button>
               </div>`
        }

        ${
          hasSummary
            ? `<div class="summary-box">
                 ${column.summary ? `<div>💡 ${escapeHtml(column.summary)}</div>` : ''}
                 ${column.discussionQuestion ? `<div class="discussion-q">❓ ${escapeHtml(column.discussionQuestion)}</div>` : ''}
               </div>`
            : ''
        }

        <div class="cards">
          ${
            column.answers.length || column.also.length
              ? column.answers.map(function(a) { return renderCard(a, column); }).join('') +
                column.also.map(function(a) { return renderCard(a, column, true); }).join('')
              : '<div class="drop-hint teacher-only">把回答拖到這裡</div>'
          }
        </div>
      </div>
    `;
  }


  function categoryColor(id) {
    const i = state.board.categories.findIndex(function(c) { return c.id === id; });
    return i >= 0 ? colorFor(i) : UNCLASSIFIED_COLOR;
  }


  function labelChips(ids) {
    return '<div class="label-chips">' + ids.map(function(id) {
      return '<span class="label-chip" style="--chip:' + categoryColor(id) + '">' + escapeHtml(categoryName(id)) + '</span>';
    }).join('') + '</div>';
  }


  function renderCard(a, column, also) {

    const showNames = $('showNames').checked;
    const extras = a.extraCategoryIds || [];

    // 副本：只顯示回答、主要在哪一類
    if (also) {
      return `
        <div class="answer-card also ${a.confirmed ? 'confirmed' : 'ai'}" draggable="false" data-also="1" data-answer-id="${escapeHtml(a.answerId)}">
          <div class="also-label">也屬於這一類・主要在「${escapeHtml(categoryName(a.categoryId))}」</div>
          <div class="answer-text">${escapeHtml(a.answer)}</div>
          ${showNames ? `<div class="card-meta"><span class="student">${escapeHtml(a.name)}（${escapeHtml(a.studentId)}）</span></div>` : ''}
          <div class="card-controls teacher-only">
            <button type="button" class="mini ghost" onclick="openLabels('${a.answerId}')">🏷 標籤</button>
          </div>
        </div>
      `;
    }
    const isRepresentative =
      column.representativeAnswerId && column.representativeAnswerId === a.answerId;

    const stateClass = a.confirmed ? 'confirmed' : (a.classified ? 'ai' : '');

    let tag = '';

    if (a.confirmed) {
      tag = '<span class="tag ok teacher-only" title="' + (a.confirmedBy === 'AI自動' ? '自動分類時由 AI 確認' : '老師確認') + '">✓ ' +
        (a.confirmedBy === 'AI自動' ? 'AI 自動確認' : '老師確認') + '</span>';
    } else if (a.classified) {
      tag = '<span class="tag ai teacher-only">AI 建議' +
        (a.confidence ? '・信心' + escapeHtml(a.confidence) : '') + '</span>';
    }

    const options = [{ id: '', name: '未分類' }]
      .concat(state.board.categories)
      .map(function(c) {
        return `<option value="${escapeHtml(c.id)}" ${c.id === (a.categoryId || '') ? 'selected' : ''}>${escapeHtml(c.name)}</option>`;
      })
      .join('');

    const canConfirm = a.classified && !a.confirmed;

    return `
      <div class="answer-card ${stateClass} ${isRepresentative ? 'representative' : ''}"
           draggable="${state.present ? 'false' : 'true'}"
           data-answer-id="${escapeHtml(a.answerId)}">

        ${isRepresentative ? '<div class="rep-label">⭐ 代表回答</div>' : ''}

        <div class="answer-text">${escapeHtml(a.answer)}</div>

        ${extras.length ? `<div class="cross-tag">跨 ${extras.length + 1} 類</div>${labelChips([a.categoryId].concat(extras))}` : ''}

        <div class="card-meta">
          ${showNames ? `<span class="student">${escapeHtml(a.name)}（${escapeHtml(a.studentId)}）</span>` : ''}
          ${tag}
        </div>

        ${a.reason && !a.confirmed ? `<div class="reason teacher-only">AI 理由：${escapeHtml(a.reason)}</div>` : ''}
        ${a.aiCategoryId && (a.aiCategoryId !== a.categoryId || (a.aiExtraCategoryIds || []).join() !== extras.join())
          ? `<div class="reason teacher-only">AI 原本分在「${escapeHtml([a.aiCategoryId].concat(a.aiExtraCategoryIds || []).map(categoryName).join('、'))}」${a.aiReason ? '：' + escapeHtml(a.aiReason) : ''}</div>`
          : ''}
        ${a.studentAgree
          ? `<div class="reason teacher-only student-reply ${a.studentAgree === '符合' ? 'agree' : 'disagree'}">學生回覆：${escapeHtml(a.studentAgree)}${a.studentNote ? '・' + escapeHtml(a.studentNote) : ''}</div>`
          : ''}

        <div class="card-controls teacher-only">
          <select aria-label="移動到類別" onchange="moveAnswer('${a.answerId}', this.value)">${options}</select>
          ${canConfirm ? `<button type="button" class="mini green" title="確認這個分類" onclick="moveAnswer('${a.answerId}', '${a.categoryId}')">✓</button>` : ''}
          ${state.board.categories.length > 1 ? `<button type="button" class="mini ghost" title="這份回答同時屬於好幾類時用" onclick="openLabels('${a.answerId}')">🏷 標籤</button>` : ''}
        </div>
      </div>
    `;
  }


  /* ==================================================
     類別編輯
  ================================================== */

  function renderEditor() {

    const box = $('categoryEditor');

    if (!state.editorCats.length) {
      box.innerHTML =
        '<p class="hint">還沒有類別。可以手動新增，或按「讓 AI 建議類別」，AI 會先讀過全部回答再提出建議，你修改後再儲存。</p>';
      return;
    }

    box.innerHTML = state.editorCats
      .map(function(c, i) {
        return `
          <div class="editor-row">
            <span class="color-dot" style="background:${colorFor(i)}"></span>

            <div class="editor-fields">
              <input value="${escapeHtml(c.name)}" maxlength="20"
                placeholder="類別名稱" aria-label="類別名稱"
                oninput="editCategory(${i}, 'name', this.value)">
              <textarea placeholder="判斷特徵：什麼樣的回答屬於這一類" aria-label="類別說明"
                oninput="editCategory(${i}, 'description', this.value)">${escapeHtml(c.description)}</textarea>
            </div>

            <div class="editor-actions">
              <button type="button" class="mini gray" title="往上移" onclick="moveCategoryRow(${i}, -1)" ${i === 0 ? 'disabled' : ''}>↑</button>
              <button type="button" class="mini gray" title="往下移" onclick="moveCategoryRow(${i}, 1)" ${i === state.editorCats.length - 1 ? 'disabled' : ''}>↓</button>
              <button type="button" class="mini red" title="刪除類別" onclick="removeCategoryRow(${i})">✕</button>
            </div>
          </div>
        `;
      })
      .join('');
  }


  function markDirty() {
    state.editorDirty = true;
    showMessage('editorMessage', '⚠ 類別設定尚未儲存', 'warn');
  }


  function editCategory(index, field, value) {

    if (!state.editorCats[index]) {
      return;
    }

    state.editorCats[index][field] = value;
    markDirty();
  }


  function addCategoryRow() {

    if (state.editorCats.length >= 10) {
      alert('類別最多 10 個');
      return;
    }

    state.editorCats.push({ id: '', name: '', description: '' });
    markDirty();
    renderEditor();

    const inputs = document.querySelectorAll('#categoryEditor input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }


  function removeCategoryRow(index) {
    state.editorCats.splice(index, 1);
    markDirty();
    renderEditor();
  }


  function moveCategoryRow(index, delta) {

    const target = index + delta;

    if (target < 0 || target >= state.editorCats.length) {
      return;
    }

    const item = state.editorCats.splice(index, 1)[0];
    state.editorCats.splice(target, 0, item);

    markDirty();
    renderEditor();
  }


  function suggestCategories() {

    if (state.busy || !state.board) {
      return;
    }

    if (
      state.editorCats.length &&
      !confirm('AI 建議會取代編輯區目前的類別。按「儲存類別」之前，實際資料不會改變。要繼續嗎？')
    ) {
      return;
    }

    setBusy(true, 'AI 正在閱讀全部回答並歸納類別，大約需要 10 到 30 秒……', 'editorMessage');

    google.script.run
      .withSuccessHandler(function(result) {

        setBusy(false);

        // 名稱和現有類別相同的，保留原本的類別與分類
        const existingByName = {};

        state.board.categories.forEach(function(c) {
          existingByName[c.name] = c.id;
        });

        state.editorCats = result.categories.map(function(c) {
          return {
            id: existingByName[c.name] || '',
            name: c.name,
            description: c.description
          };
        });

        state.editorDirty = true;
        renderEditor();

        let text =
          '✓ AI 讀了 ' + result.analyzedCount + ' 份回答，建議 ' +
          result.categories.length + ' 個類別。請檢查、修改後按「儲存類別」。';

        if (result.analyzedCount < result.answerCount) {
          text += '（共 ' + result.answerCount + ' 份，只分析了前 ' + result.analyzedCount + ' 份）';
        }

        showMessage('editorMessage', text, 'warn');
      })
      .withFailureHandler(function(error) {
        setBusy(false);
        showMessage('editorMessage', '建議失敗：' + error.message, 'error');
      })
      .suggestCategories(state.questionId);
  }


  function saveCategories() {

    if (state.busy || !state.board) {
      return;
    }

    const categories = state.editorCats.map(function(c) {
      return { id: c.id, name: c.name.trim(), description: c.description.trim() };
    });

    if (categories.some(function(c) { return !c.name; })) {
      alert('每個類別都需要名稱');
      return;
    }

    const names = categories.map(function(c) { return c.name; });

    if (new Set(names).size !== names.length) {
      alert('類別名稱不能重複');
      return;
    }

    const keepIds = new Set(categories.map(function(c) { return c.id; }).filter(Boolean));

    const removed = state.board.categories.filter(function(c) {
      return !keepIds.has(c.id);
    });

    const affected = state.board.answers.filter(function(a) {
      return removed.some(function(c) { return c.id === a.categoryId; });
    }).length;

    if (
      affected > 0 &&
      !confirm(
        '這次儲存會刪除 ' + removed.length + ' 個原有類別，裡面的 ' + affected +
        ' 份回答會變回「未分類」（包含已確認的）。確定要儲存嗎？'
      )
    ) {
      return;
    }

    setBusy(true, '儲存中……', 'editorMessage');

    google.script.run
      .withSuccessHandler(function() {
        setBusy(false);
        state.editorDirty = false;
        showMessage('editorMessage', '✓ 類別已儲存', 'success');
        loadBoard(true);
      })
      .withFailureHandler(function(error) {
        setBusy(false);
        showMessage('editorMessage', '儲存失敗：' + error.message, 'error');
      })
      .saveCategories(state.questionId, categories);
  }


  /* ==================================================
     AI 分類
  ================================================== */

  function ensureReadyForAI() {

    if (state.busy || !state.board) {
      return false;
    }

    if (state.editorDirty) {
      alert('類別設定還沒儲存，請先按「儲存類別」');
      return false;
    }

    if (!state.board.categories.length) {
      alert('請先建立並儲存類別');
      return false;
    }

    return true;
  }


  function classifyUnclassified() {

    if (!ensureReadyForAI()) {
      return;
    }

    runClassifyLoop(0);
  }


  function reclassifyUnconfirmed() {

    if (!ensureReadyForAI()) {
      return;
    }

    if (!confirm('未確認的 AI 分類會清掉重新分類，已確認的卡片不會改動。要繼續嗎？')) {
      return;
    }

    setBusy(true, '清除未確認的分類……', 'aiMessage');

    google.script.run
      .withSuccessHandler(function() {
        runClassifyLoop(0);
      })
      .withFailureHandler(function(error) {
        setBusy(false);
        showMessage('aiMessage', '重新分類失敗：' + error.message, 'error');
      })
      .clearUnconfirmedClassifications(state.questionId);
  }


  /*
   * 後端每次最多跑約 4.5 分鐘，還沒完成就自動再呼叫一次。
   */
  function runClassifyLoop(total) {

    setBusy(true, 'AI 分類中，已完成 ' + total + ' 份……', 'aiMessage');

    google.script.run
      .withSuccessHandler(function(result) {

        total += result.processed;

        if (!result.done && result.processed > 0) {
          loadBoard(true);
          runClassifyLoop(total);
          return;
        }

        setBusy(false);

        if (result.done) {
          showMessage(
            'aiMessage',
            total === 0 ? '目前沒有需要分類的回答' : '✓ 分類完成，這次分類了 ' + total + ' 份回答',
            'success'
          );
        } else {
          showMessage(
            'aiMessage',
            '已分類 ' + total + ' 份，還有 ' + result.remaining + ' 份沒完成，可以再按一次繼續',
            'warn'
          );
        }

        loadBoard(true);
      })
      .withFailureHandler(function(error) {
        setBusy(false);
        showMessage('aiMessage', '分類中斷（已完成 ' + total + ' 份）：' + error.message, 'error');
        loadBoard(true);
      })
      .classifyAnswers(state.questionId);
  }


  function confirmAll() {

    if (state.busy || !state.board) {
      return;
    }

    const count = state.board.answers.filter(function(a) {
      return a.classified && !a.confirmed;
    }).length;

    if (!count) {
      alert('目前沒有待確認的分類');
      return;
    }

    if (!confirm('要把 ' + count + ' 份 AI 分類全部標為已確認嗎？')) {
      return;
    }

    runConfirm('');
  }


  function confirmCategory(categoryId) {

    if (state.busy || !state.board) {
      return;
    }

    const count = state.board.answers.filter(function(a) {
      return a.categoryId === categoryId && a.classified && !a.confirmed;
    }).length;

    if (!count) {
      alert('這個類別沒有待確認的回答');
      return;
    }

    runConfirm(categoryId);
  }


  function runConfirm(categoryId) {

    setBusy(true, '確認中……', 'aiMessage');

    google.script.run
      .withSuccessHandler(function(result) {
        setBusy(false);
        showMessage('aiMessage', '✓ 已確認 ' + result.count + ' 份分類', 'success');
        loadBoard(true);
      })
      .withFailureHandler(function(error) {
        setBusy(false);
        showMessage('aiMessage', '確認失敗：' + error.message, 'error');
      })
      .confirmClassifications(state.questionId, categoryId);
  }


  function summarize() {

    if (!ensureReadyForAI()) {
      return;
    }

    setBusy(true, 'AI 正在整理每個類別的摘要與討論提問……', 'aiMessage');

    google.script.run
      .withSuccessHandler(function(result) {
        setBusy(false);
        showMessage('aiMessage', '✓ 已更新 ' + result.updated + ' 個類別的摘要與討論提問', 'success');
        loadBoard(true);
      })
      .withFailureHandler(function(error) {
        setBusy(false);
        showMessage('aiMessage', '產生失敗：' + error.message, 'error');
      })
      .summarizeCategories(state.questionId);
  }


  /* ==================================================
     移動卡片
  ================================================== */

  function moveAnswer(answerId, categoryId) {

    if (!state.board) {
      return;
    }

    const a = state.board.answers.find(function(item) {
      return item.answerId === answerId;
    });

    if (!a) {
      return;
    }

    const previous = {
      categoryId: a.categoryId,
      confirmed: a.confirmed,
      classified: a.classified,
      reason: a.reason
    };

    // 先更新畫面，再寫回試算表
    previous.confirmedBy = a.confirmedBy;
    previous.extraCategoryIds = (a.extraCategoryIds || []).slice();
    a.extraCategoryIds = categoryId
      ? (a.extraCategoryIds || []).filter(function(id) { return id !== categoryId; })
      : [];
    a.categoryId = categoryId || '';
    a.confirmedBy = '教師';
    a.confirmed = true;
    a.classified = true;

    state.pendingOps++;

    renderStats();
    renderBoard();
    renderFocus();

    google.script.run
      .withSuccessHandler(function() {
        state.pendingOps--;
        if (state.pendingOps === 0) loadBoard(true);
      })
      .withFailureHandler(function(error) {
        state.pendingOps--;
        Object.assign(a, previous);
        renderStats();
        renderBoard();
        renderFocus();
        alert('移動失敗：' + error.message);
      })
      .setAnswerCategory(answerId, categoryId || '');
  }


  function setupDragAndDrop() {

    const boardEl = $('board');

    boardEl.addEventListener('dragstart', function(event) {

      const card = event.target.closest && event.target.closest('.answer-card');

      if (!card || state.present) {
        return;
      }

      state.dragging = true;
      event.dataTransfer.setData('text/plain', card.dataset.answerId);
      event.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });

    boardEl.addEventListener('dragend', function() {
      state.dragging = false;
      document.querySelectorAll('.dragging').forEach(function(el) {
        el.classList.remove('dragging');
      });
      clearDragOver();
    });

    boardEl.addEventListener('dragover', function(event) {

      const column = event.target.closest && event.target.closest('.column');

      if (!column || !state.dragging) {
        return;
      }

      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';

      if (!column.classList.contains('drag-over')) {
        clearDragOver();
        column.classList.add('drag-over');
      }
    });

    boardEl.addEventListener('drop', function(event) {

      const column = event.target.closest && event.target.closest('.column');

      if (!column) {
        return;
      }

      event.preventDefault();
      clearDragOver();
      state.dragging = false;

      const answerId = event.dataTransfer.getData('text/plain');
      const categoryId = column.dataset.categoryId || '';

      const a = state.board && state.board.answers.find(function(item) {
        return item.answerId === answerId;
      });

      if (!a) {
        return;
      }

      if (a.categoryId === categoryId && a.confirmed) {
        renderBoard();
        return;
      }

      moveAnswer(answerId, categoryId);
    });
  }


  function clearDragOver() {
    document.querySelectorAll('.drag-over').forEach(function(el) {
      el.classList.remove('drag-over');
    });
  }


  /* ==================================================
     投影與聚焦
  ================================================== */

  function togglePresent() {

    state.present = !state.present;
    document.body.classList.toggle('present', state.present);

    rerender();
    window.scrollTo(0, 0);
  }


  function openFocus(categoryId) {

    state.focusCategoryId = categoryId;

    $('focusOverlay').classList.add('open');
    document.body.classList.add('no-scroll');

    renderFocus();
  }


  function closeFocus() {

    state.focusCategoryId = null;

    $('focusOverlay').classList.remove('open');
    $('focusOverlay').innerHTML = '';
    document.body.classList.remove('no-scroll');
  }


  function stepFocus(delta) {

    if (state.focusCategoryId === null || !state.board) {
      return;
    }

    const columns = getColumns().filter(function(c) { return !c.isUnclassified; });

    const index = columns.findIndex(function(c) {
      return c.id === state.focusCategoryId;
    });

    if (index < 0 || columns.length < 2) {
      return;
    }

    state.focusCategoryId = columns[(index + delta + columns.length) % columns.length].id;
    renderFocus();
  }


  function renderFocus() {

    if (state.focusCategoryId === null || !state.board) {
      return;
    }

    const columns = getColumns().filter(function(c) { return !c.isUnclassified; });

    const column = columns.find(function(c) {
      return c.id === state.focusCategoryId;
    });

    if (!column) {
      closeFocus();
      return;
    }

    const showNames = $('showNames').checked;
    const position = columns.indexOf(column) + 1;

    $('focusOverlay').innerHTML = `
      <div class="focus-inner" style="--col:${column.color}">

        <div class="focus-top">
          <div>
            <button type="button" class="ghost" onclick="stepFocus(-1)">← 上一類</button>
            <button type="button" class="ghost" onclick="stepFocus(1)">下一類 →</button>
            <span style="margin-left:10px;opacity:.7">${position} / ${columns.length}</span>
          </div>
          <button type="button" class="ghost" onclick="closeFocus()">✕ 關閉（Esc）</button>
        </div>

        <div class="focus-question">${escapeHtml(state.board.question.content)}</div>

        <h2 class="focus-title">${escapeHtml(column.name)}<small>${column.answers.length + column.also.length} 份回答${column.also.length ? '（其中 ' + column.also.length + ' 份跨類別）' : ''}</small></h2>

        ${column.description ? `<p class="focus-desc">${escapeHtml(column.description)}</p>` : ''}
        ${column.summary ? `<div class="focus-summary">💡 ${escapeHtml(column.summary)}</div>` : ''}
        ${column.discussionQuestion ? `<div class="focus-discussion">❓ ${escapeHtml(column.discussionQuestion)}</div>` : ''}

        <div class="focus-cards">
          ${
            column.answers.length || column.also.length
              ? column.answers.concat(column.also).map(function(a) {
                  const rep = a.answerId === column.representativeAnswerId;
                  return `
                    <div class="focus-card ${rep ? 'representative' : ''}">${rep ? '<div class="rep-label">⭐ 代表回答</div>' : ''}${escapeHtml(a.answer)}${showNames ? `<span class="student">— ${escapeHtml(a.name)}</span>` : ''}</div>
                  `;
                }).join('')
              : '<p>這一類目前沒有回答。</p>'
          }
        </div>
      </div>
    `;
  }



  /* ==================================================
     跨類別標籤
  ================================================== */

  let labelAnswerId = '';

  function openLabels(answerId) {

    const a = state.board.answers.find(function(x) { return x.answerId === answerId; });

    if (!a) return;

    labelAnswerId = answerId;

    const chosen = a.categoryId ? [a.categoryId].concat(a.extraCategoryIds || []) : [];

    $('labelPreview').textContent = a.answer;
    $('labelRows').innerHTML = state.board.categories.map(function(c, i) {
      const on = chosen.indexOf(c.id) >= 0;
      return '<label class="label-row">' +
        '<input type="checkbox" value="' + escapeHtml(c.id) + '"' + (on ? ' checked' : '') + ' onchange="syncLabelRows()">' +
        '<span><span class="swatch" style="--chip:' + colorFor(i) + '"></span>' + escapeHtml(c.name) + '</span>' +
        '<span class="main"><input type="radio" name="labelMain" value="' + escapeHtml(c.id) + '"' + (c.id === a.categoryId ? ' checked' : '') + '> 主要</span>' +
        '</label>';
    }).join('');

    syncLabelRows();
    $('labelDialog').showModal();
  }


  function syncLabelRows() {

    const boxes = Array.prototype.slice.call($('labelRows').querySelectorAll('input[type=checkbox]'));
    const checked = boxes.filter(function(b) { return b.checked; });

    boxes.forEach(function(b) {
      const radio = b.closest('.label-row').querySelector('input[type=radio]');
      radio.disabled = !b.checked;
      if (!b.checked) radio.checked = false;
      // 最多 3 個
      b.disabled = !b.checked && checked.length >= 3;
    });

    // 沒有主要的時候，第一個勾的當主要
    if (checked.length && !$('labelRows').querySelector('input[type=radio]:checked')) {
      checked[0].closest('.label-row').querySelector('input[type=radio]').checked = true;
    }
  }


  function saveLabels() {

    const main = $('labelRows').querySelector('input[type=radio]:checked');
    const ids = Array.prototype.map.call($('labelRows').querySelectorAll('input[type=checkbox]:checked'), function(b) { return b.value; });
    const ordered = main ? [main.value].concat(ids.filter(function(id) { return id !== main.value; })) : [];
    const a = state.board.answers.find(function(x) { return x.answerId === labelAnswerId; });

    $('labelDialog').close();

    if (!a) return;

    const previous = { categoryId: a.categoryId, extraCategoryIds: (a.extraCategoryIds || []).slice(), confirmed: a.confirmed, classified: a.classified, confirmedBy: a.confirmedBy };

    a.categoryId = ordered[0] || '';
    a.extraCategoryIds = ordered.slice(1);
    a.confirmed = true;
    a.classified = true;
    a.confirmedBy = '教師';

    state.pendingOps++;
    renderStats();
    renderBoard();
    renderFocus();
    renderCharts();

    google.script.run
      .withSuccessHandler(function() {
        state.pendingOps--;
        if (state.pendingOps === 0) loadBoard(true);
      })
      .withFailureHandler(function(error) {
        state.pendingOps--;
        Object.assign(a, previous);
        renderStats();
        renderBoard();
        renderCharts();
        alert('沒有存到：' + (/不允許呼叫的功能/.test(error.message)
          ? '要等 Apps Script 換上新版 Code.gs 並部署後才能使用跨類別標籤。'
          : error.message));
      })
      .setAnswerCategories(labelAnswerId, ordered);
  }


  /* ==================================================
     依學習目標建議類別（還沒有回答也可以）
  ================================================== */

  function suggestFromObjective() {

    if (state.busy || !state.board) return;

    if (
      state.editorCats.length &&
      !confirm('AI 建議會取代編輯區目前的類別。按「儲存類別」之前，實際資料不會改變。要繼續嗎？')
    ) {
      return;
    }

    setBusy(true, 'AI 正在依學習目標設計類別……', 'editorMessage');

    google.script.run
      .withSuccessHandler(function(result) {
        setBusy(false);
        const existingByName = {};
        state.board.categories.forEach(function(c) { existingByName[c.name] = c.id; });
        state.editorCats = result.categories.map(function(c) {
          return { id: existingByName[c.name] || '', name: c.name, description: c.description };
        });
        state.editorDirty = true;
        renderEditor();
        showMessage('editorMessage', '✓ 依學習目標建議了 ' + result.categories.length + ' 個類別。請檢查、修改後按「儲存類別」。', 'warn');
      })

          ? '要等 Apps Script 換上新版 Code.gs 並部署後才能使用。'
          : error.message), 'error');

  /* ==================================================
     統計圖：長條圖、集合圖、折線圖
  ================================================== */

  function toggleCharts() {
    const box = $('charts');
    box.hidden = !box.hidden;
    $('chartsToggle').setAttribute('aria-pressed', String(!box.hidden));
    $('chartsToggle').textContent = box.hidden ? '📊 統計圖' : '📊 收起統計圖';
    try { localStorage.setItem('aiclassroom_discuss_charts', box.hidden ? '0' : '1'); } catch (error) { /* 忽略 */ }
    renderCharts();
  }


  function svgText(x, y, text, attrs) {
    return '<text x="' + x + '" y="' + y + '" ' + (attrs || '') + '>' + escapeHtml(text) + '</text>';
  }


  function shorten(text, n) {
    text = String(text || '');
    return text.length > n ? text.slice(0, n - 1) + '…' : text;
  }


  /*
   * 每份回答的類別（依「只顯示已確認的分類」篩選）。
   */
  function chartData() {

    const cats = state.board.categories;
    const valid = {};
    cats.forEach(function(c) { valid[c.id] = true; });
    const confirmedOnly = $('confirmedOnly').checked;

    return state.board.answers.map(function(a) {
      const ids = (a.categoryId && valid[a.categoryId] && (!confirmedOnly || a.confirmed))
        ? [a.categoryId].concat((a.extraCategoryIds || []).filter(function(id) { return valid[id]; }))
        : [];
      return { a: a, ids: ids, time: parseTime(a.submittedAt) };
    });
  }


  function parseTime(text) {
    const m = String(text || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})\D+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)).getTime() : 0;
  }


  function renderCharts() {

    const box = $('charts');

    if (!box || box.hidden || !state.board) return;

    const cats = state.board.categories;
    const rows = chartData();

    if (!cats.length || !rows.some(function(r) { return r.ids.length; })) {
      box.innerHTML = '<div class="chart-card"><p class="chart-empty">還沒有分類好的回答。建立類別並分類後，這裡會出現長條圖、集合圖和折線圖。</p></div>';
      return;
    }

    const single = rows.filter(function(r) { return r.ids.length === 1; }).length;
    const cross = rows.filter(function(r) { return r.ids.length > 1; }).length;
    const none = rows.length - single - cross;

    box.innerHTML =
      '<div class="chart-card" style="margin-bottom:16px">' +
        '<div class="mix"><span>單一類別<b>' + single + '</b></span><span>跨類別<b>' + cross + '</b></span>' +
        '<span>未分類' + ($('confirmedOnly').checked ? '／待確認' : '') + '<b>' + none + '</b></span><span>共<b>' + rows.length + '</b> 份</span></div>' +
        '<p class="chart-sub" style="margin:0">跨類別的回答會同時算進它所屬的每一類，所以各類加總會比回答份數多。</p>' +
      '</div>' +
      '<div class="chart-grid">' +
        '<div class="chart-card"><h3>各類別人數</h3><p class="chart-sub">實心＝只屬於這一類；斜線＝同時屬於其他類</p>' + barChart(cats, rows) +
          '<div class="chart-legend"><span style="--chip:#475c75">只屬於這一類</span><span class="hatch">跨類別</span></div></div>' +
        '<div class="chart-card"><h3>類別的重疊</h3><p class="chart-sub">' + (cats.length <= 3 ? '圈圈重疊的地方是同時屬於那幾類的回答' : '每一直條是一種組合；下方的點表示包含哪幾類') + '</p>' +
          (cats.length <= 3 ? vennChart(cats, rows) : upsetChart(cats, rows)) + '</div>' +
        '<div class="chart-card"><h3>回答累積的過程</h3><p class="chart-sub">依送出時間，各類別累積的回答數</p>' + lineChart(cats, rows) +
          '<div class="chart-legend">' + cats.map(function(c, i) { return '<span style="--chip:' + colorFor(i) + '">' + escapeHtml(c.name) + '</span>'; }).join('') + '</div></div>' +
      '</div>';
  }


  function barChart(cats, rows) {

    const data = cats.map(function(c, i) {
      const has = rows.filter(function(r) { return r.ids.indexOf(c.id) >= 0; });
      return { c: c, color: colorFor(i), only: has.filter(function(r) { return r.ids.length === 1; }).length, cross: has.filter(function(r) { return r.ids.length > 1; }).length };
    });

    const max = Math.max(1, Math.max.apply(null, data.map(function(d) { return d.only + d.cross; })));
    const W = 430, left = 116, right = 34, rowH = 36, H = data.length * rowH + 10;
    const scale = (W - left - right) / max;

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="各類別人數長條圖">' +
      '<defs>' + data.map(function(d, i) {
        return '<pattern id="hatch' + i + '" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="' + d.color + '" fill-opacity=".25"/><line x1="0" y1="0" x2="0" y2="6" stroke="' + d.color + '" stroke-width="3"/></pattern>';
      }).join('') + '</defs>' +
      data.map(function(d, i) {
        const y = i * rowH + 6, w1 = d.only * scale, w2 = d.cross * scale;
        return '<g>' +
          svgText(left - 8, y + 18, shorten(d.c.name, 8), 'text-anchor="end" font-size="14" fill="currentColor"') +
          '<rect x="' + left + '" y="' + y + '" width="' + Math.max(w1, 0) + '" height="24" rx="3" fill="' + d.color + '"><title>' + escapeHtml(d.c.name) + '：只屬於這一類 ' + d.only + ' 份</title></rect>' +
          '<rect x="' + (left + w1) + '" y="' + y + '" width="' + Math.max(w2, 0) + '" height="24" rx="3" fill="url(#hatch' + i + ')" stroke="' + d.color + '"><title>' + escapeHtml(d.c.name) + '：跨類別 ' + d.cross + ' 份</title></rect>' +
          svgText(left + w1 + w2 + 6, y + 18, String(d.only + d.cross), 'font-size="15" font-weight="700" fill="currentColor"') +
        '</g>';
      }).join('') + '</svg>';
  }


  function comboKey(ids, cats) {
    return cats.map(function(c) { return ids.indexOf(c.id) >= 0 ? '1' : '0'; }).join('');
  }


  function vennChart(cats, rows) {

    const counts = {};
    rows.forEach(function(r) { if (r.ids.length) { const k = comboKey(r.ids, cats); counts[k] = (counts[k] || 0) + 1; } });
    const n = function(k) { return counts[k] || 0; };
    const col = function(i) { return colorFor(i); };

    if (cats.length === 1) {
      return '<svg viewBox="0 0 520 220" role="img" aria-label="集合圖"><circle cx="260" cy="110" r="90" fill="' + col(0) + '" fill-opacity=".2" stroke="' + col(0) + '" stroke-width="2"/>' +
        svgText(260, 116, String(n('1')), 'text-anchor="middle" font-size="22" font-weight="700" fill="currentColor"') +
        svgText(260, 214, shorten(cats[0].name, 12), 'text-anchor="middle" font-size="13" fill="currentColor"') + '</svg>';
    }

    if (cats.length === 2) {
      return '<svg viewBox="0 0 520 250" role="img" aria-label="兩個類別的集合圖">' +
        '<circle cx="200" cy="120" r="100" fill="' + col(0) + '" fill-opacity=".18" stroke="' + col(0) + '" stroke-width="2"/>' +
        '<circle cx="320" cy="120" r="100" fill="' + col(1) + '" fill-opacity=".18" stroke="' + col(1) + '" stroke-width="2"/>' +
        svgText(145, 127, String(n('10')), 'text-anchor="middle" font-size="22" font-weight="700" fill="currentColor"') +
        svgText(375, 127, String(n('01')), 'text-anchor="middle" font-size="22" font-weight="700" fill="currentColor"') +
        svgText(260, 127, String(n('11')), 'text-anchor="middle" font-size="22" font-weight="700" fill="currentColor"') +
        svgText(260, 150, '兩類都有', 'text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".7"') +
        svgText(150, 244, shorten(cats[0].name, 12), 'text-anchor="middle" font-size="13" fill="' + col(0) + '" font-weight="700"') +
        svgText(370, 244, shorten(cats[1].name, 12), 'text-anchor="middle" font-size="13" fill="' + col(1) + '" font-weight="700"') + '</svg>';
    }

    // 三類
    return '<svg viewBox="0 0 520 330" role="img" aria-label="三個類別的集合圖">' +
      '<circle cx="210" cy="125" r="100" fill="' + col(0) + '" fill-opacity=".16" stroke="' + col(0) + '" stroke-width="2"/>' +
      '<circle cx="310" cy="125" r="100" fill="' + col(1) + '" fill-opacity=".16" stroke="' + col(1) + '" stroke-width="2"/>' +
      '<circle cx="260" cy="210" r="100" fill="' + col(2) + '" fill-opacity=".16" stroke="' + col(2) + '" stroke-width="2"/>' +
      svgText(170, 105, String(n('100')), 'text-anchor="middle" font-size="20" font-weight="700" fill="currentColor"') +
      svgText(350, 105, String(n('010')), 'text-anchor="middle" font-size="20" font-weight="700" fill="currentColor"') +
      svgText(260, 268, String(n('001')), 'text-anchor="middle" font-size="20" font-weight="700" fill="currentColor"') +
      svgText(260, 98, String(n('110')), 'text-anchor="middle" font-size="18" font-weight="700" fill="currentColor"') +
      svgText(200, 195, String(n('101')), 'text-anchor="middle" font-size="18" font-weight="700" fill="currentColor"') +
      svgText(320, 195, String(n('011')), 'text-anchor="middle" font-size="18" font-weight="700" fill="currentColor"') +
      svgText(260, 165, String(n('111')), 'text-anchor="middle" font-size="18" font-weight="700" fill="currentColor"') +
      svgText(110, 30, shorten(cats[0].name, 10), 'text-anchor="middle" font-size="13" font-weight="700" fill="' + col(0) + '"') +
      svgText(410, 30, shorten(cats[1].name, 10), 'text-anchor="middle" font-size="13" font-weight="700" fill="' + col(1) + '"') +
      svgText(260, 326, shorten(cats[2].name, 14), 'text-anchor="middle" font-size="13" font-weight="700" fill="' + col(2) + '"') + '</svg>';
  }


  /*
   * 四類以上：UpSet 圖。每一直條是一種組合（例如「A＋C」），下方的點標出包含哪幾類。
   */
  function upsetChart(cats, rows) {

    const counts = {};
    rows.forEach(function(r) { if (r.ids.length) { const k = comboKey(r.ids, cats); counts[k] = (counts[k] || 0) + 1; } });

    const combos = Object.keys(counts)
      .map(function(k) { return { k: k, n: counts[k], size: k.split('').filter(function(x) { return x === '1'; }).length }; })
      .sort(function(a, b) { return b.n - a.n || a.size - b.size; })
      .slice(0, 12);

    const used = cats.map(function(c, i) { return i; }).filter(function(i) { return combos.some(function(c) { return c.k[i] === '1'; }); });
    const left = 120, colW = 34, barH = 120, top = 18, dotTop = top + barH + 18, rowH = 22;
    const W = Math.max(360, left + combos.length * colW + 20), H = dotTop + used.length * rowH + 6;
    const max = Math.max.apply(null, combos.map(function(c) { return c.n; }));

    let out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="類別組合圖">';

    combos.forEach(function(c, j) {
      const x = left + j * colW + 6, h = c.n / max * barH, cross = c.size > 1;
      out += '<rect x="' + x + '" y="' + (top + barH - h) + '" width="' + (colW - 12) + '" height="' + h + '" rx="3" fill="' + (cross ? '#6446c0' : '#7d8899') + '"><title>' + c.n + ' 份</title></rect>' +
        svgText(x + (colW - 12) / 2, top + barH - h - 4, String(c.n), 'text-anchor="middle" font-size="12" font-weight="700" fill="currentColor"');
    });

    used.forEach(function(i, r) {
      const y = dotTop + r * rowH + 8;
      out += svgText(left - 10, y + 4, shorten(cats[i].name, 8), 'text-anchor="end" font-size="12" fill="currentColor"');
      combos.forEach(function(c, j) {
        const cx = left + j * colW + colW / 2;
        out += '<circle cx="' + cx + '" cy="' + y + '" r="5" fill="' + (c.k[i] === '1' ? colorFor(i) : 'none') + '" stroke="' + (c.k[i] === '1' ? colorFor(i) : '#c9ced6') + '"/>';
      });
    });

    combos.forEach(function(c, j) {
      const on = used.filter(function(i) { return c.k[i] === '1'; });
      if (on.length > 1) {
        const cx = left + j * colW + colW / 2;
        const y1 = dotTop + used.indexOf(on[0]) * rowH + 8, y2 = dotTop + used.indexOf(on[on.length - 1]) * rowH + 8;
        out += '<line x1="' + cx + '" x2="' + cx + '" y1="' + y1 + '" y2="' + y2 + '" stroke="#6446c0" stroke-width="2"/>';
      }
    });

    return out + '</svg><div class="chart-legend"><span style="--chip:#7d8899">只屬於一類</span><span style="--chip:#6446c0">跨類別的組合</span></div>';
  }


  function lineChart(cats, rows) {

    const timed = rows.filter(function(r) { return r.time && r.ids.length; }).sort(function(a, b) { return a.time - b.time; });

    if (timed.length < 2) {
      return '<p class="chart-empty">回答累積到 2 份以上就會畫出折線。</p>';
    }

    const t0 = timed[0].time, t1 = timed[timed.length - 1].time, span = Math.max(t1 - t0, 60000);
    const W = 440, H = 230, left = 34, right = 16, top = 16, bottom = 34;
    const totals = cats.map(function(c) { return timed.filter(function(r) { return r.ids.indexOf(c.id) >= 0; }).length; });
    const max = Math.max(1, Math.max.apply(null, totals));
    const X = function(t) { return left + (t - t0) / span * (W - left - right); };
    const Y = function(v) { return top + (1 - v / max) * (H - top - bottom); };
    const step = Math.max(1, Math.ceil(max / 5));
    const fmt = function(t) { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

    let out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="各類別回答累積折線圖">';

    for (let v = 0; v <= max; v += step) {
      out += '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#e3e6eb"/>' +
        svgText(left - 6, Y(v) + 4, String(v), 'text-anchor="end" font-size="11" fill="currentColor" opacity=".7"');
    }

    out += svgText(left, H - 10, fmt(t0), 'font-size="11" fill="currentColor" opacity=".7"') +
      svgText(W - right, H - 10, fmt(t1), 'text-anchor="end" font-size="11" fill="currentColor" opacity=".7"');

    cats.forEach(function(c, i) {
      let count = 0;
      const pts = [[X(t0), Y(0)]];
      timed.forEach(function(r) {
        if (r.ids.indexOf(c.id) >= 0) {
          pts.push([X(r.time), Y(count)]);
          count++;
          pts.push([X(r.time), Y(count)]);
        }
      });
      pts.push([X(t1), Y(count)]);
      out += '<polyline fill="none" stroke="' + colorFor(i) + '" stroke-width="2.5" stroke-linejoin="round" points="' + pts.map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"><title>' + escapeHtml(c.name) + '：' + count + ' 份</title></polyline>' +
        svgText(X(t1) + 2, Y(count) - 4, count ? String(count) : '', 'text-anchor="end" font-size="11" font-weight="700" fill="' + colorFor(i) + '"');
    });

    return out + '</svg>';
  }


  function handleKeydown(event) {

    const tag = document.activeElement ? document.activeElement.tagName : '';
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

    if (event.key === 'Escape') {
      if (state.focusCategoryId !== null) {
        closeFocus();
      } else if (state.present) {
        togglePresent();
      }
      return;
    }

    if (state.focusCategoryId !== null && !typing) {
      if (event.key === 'ArrowRight') stepFocus(1);
      if (event.key === 'ArrowLeft') stepFocus(-1);
    }
  }


  /* ==================================================
     小工具
  ================================================== */

  function setBusy(isBusy, text, messageId) {

    state.busy = isBusy;

    document.querySelectorAll('.ai-action').forEach(function(button) {
      button.disabled = isBusy;
    });

    if (isBusy && text) {
      showMessage(messageId, '⏳ ' + text, 'info');
    }
  }


  function showMessage(id, text, type) {

    const el = $(id);

    if (!el) {
      return;
    }

    el.className = 'message' + (type ? ' ' + type : '');
    el.textContent = text;
  }


  function escapeHtml(value) {

    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

</script>

<script>
  /* ===== 工具面板的分頁與收合（只負責畫面） ===== */
  (function() {

    const tabs = [
      { tab: document.getElementById('toolTabCategories'), panel: document.getElementById('toolCategories') },
      { tab: document.getElementById('toolTabAI'), panel: document.getElementById('toolAI') }
    ];

    tabs.forEach(function(item) {
      item.tab.addEventListener('click', function() {
        tabs.forEach(function(other) {
          other.tab.setAttribute('aria-selected', String(other === item));
          other.panel.hidden = other !== item;
        });
      });
    });

    const toggle = document.getElementById('toolsToggle');

    toggle.addEventListener('click', function() {
      const hidden = document.body.classList.toggle('tools-hidden');
      toggle.setAttribute('aria-pressed', String(hidden));
      toggle.textContent = hidden ? '打開工具面板' : '收起工具面板';
    });

  })();
</script>

</body>
</html>
