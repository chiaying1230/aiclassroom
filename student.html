<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>課堂問答｜AI 課堂</title>

  <script src="config.js"></script>
  <script src="gas-bridge.js"></script>

  <link rel="stylesheet" href="theme.css">
  <script src="features.js"></script>
  <script src="shell.js" defer></script>

  <style>
    :root { --page-width: 960px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 24px;
      margin-bottom: 16px;
    }

    label { display: block; margin: 0 0 6px; font-weight: 700; font-size: 14px; color: var(--ink-2); }

    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    input, textarea {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-s);
      background: var(--surface);
      font: inherit;
      font-size: 16px;
      color: var(--ink);
    }

    input { height: 44px; }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    textarea { min-height: 170px; resize: vertical; line-height: 1.8; }

    button {
      border: 1px solid transparent;
      padding: 0 20px;
      height: 44px;
      background: var(--blue);
      color: #fff;
      border-radius: var(--radius-s);
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      transition: background .15s;
    }

    button:hover { background: var(--blue-dark); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
    .secondary:hover { background: var(--surface-2); }

    /* ---------- 我的資料（橫條） ---------- */
    .identity { padding: 20px 22px; margin-bottom: 28px; }

    .identity-form {
      display: grid;
      grid-template-columns: auto 1fr 1fr auto;
      gap: 16px;
      align-items: end;
    }

    .identity-signed { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

    .avatar {
      flex: none;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-size: 19px;
      font-weight: 700;
    }

    .signed-text { flex: 1; min-width: 160px; }
    .signed-text strong { display: block; font-size: 18px; line-height: 1.4; }
    .signed-text span { display: block; font-size: 14px; color: var(--ink-2); }

    /* 題目卡上「我交過的答案」 */
    .mine {
      margin: 0 0 12px;
      padding: 9px 13px;
      border-radius: var(--radius-s);
      background: var(--green-soft);
      color: var(--green);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
    }

    .mine.passed { background: var(--blue-soft); color: var(--blue-dark); }
    .mine.returned { background: var(--orange-soft); color: var(--orange); }

    .mine-feedback {
      display: block;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(0, 0, 0, .08);
      color: var(--ink);
      font-weight: 400;
      white-space: pre-wrap;
    }

    .identity-head { align-self: center; padding-right: 8px; }
    .identity-head strong { display: block; font-size: 17px; }
    .identity-head span { display: block; font-size: 13px; color: var(--ink-2); line-height: 1.5; }

    .identity-actions { display: flex; gap: 8px; }

    .icon-button { width: 44px; padding: 0; font-size: 17px; }

    /* ---------- 分頁 ---------- */
    [hidden] { display: none !important; }

    /* ---------- 題目卡 ---------- */
    .q-card { padding: 0; overflow: hidden; }

    .q-head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 22px 24px 0;
    }

    .q-num {
      flex: 0 0 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-weight: 700;
    }

    .q-titles { flex: 1; min-width: 0; }

    .question-title {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
    }

    .points {
      flex: none;
      padding: 3px 12px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 13px;
      color: var(--ink-2);
      white-space: nowrap;
    }

    .question-content {
      margin: 14px 24px 0 74px;
      white-space: pre-wrap;
      line-height: 1.9;
      font-size: 17px;
    }

    .q-answer {
      margin-top: 20px;
      padding: 18px 24px 20px;
      background: var(--surface-2);
      border-top: 1px solid var(--line);
    }

    .q-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .q-foot .message { margin: 0; }

    /* ---------- 截止時間 ---------- */
    /* 標題下方：截止時間、繳交人數 */
    .q-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .q-meta .q-due { margin-top: 0; }

    .q-count {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 13px;
      color: var(--ink-2);
    }

    .q-count b { color: var(--ink); margin: 0 2px; }

    /* 還沒交的提醒 */
    .nudge {
      margin: 0 0 12px;
      padding: 9px 13px;
      border-radius: var(--radius-s);
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
    }

    .nudge.urgent { background: var(--orange-soft); color: var(--orange); }

    /* 題目上方：還有幾題沒交 */
    .todo-banner {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 14px 18px;
      margin-bottom: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 5px solid var(--blue);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .todo-banner.urgent { border-left-color: var(--orange); background: #fffaf3; }
    .todo-banner.done { border-left-color: var(--green); }

    .todo-text { flex: 1; min-width: 220px; }
    .todo-text strong { display: block; font-size: 17px; line-height: 1.5; }
    .todo-text span { display: block; font-size: 14px; color: var(--ink-2); }
    .todo-banner.urgent .todo-text strong { color: var(--orange); }
    .todo-banner.done .todo-text strong { color: var(--green); }
    .todo-banner button { height: 38px; }

    .q-card.highlight { box-shadow: 0 0 0 3px var(--yellow); transition: box-shadow .3s; }

    /* ---------- 展開／收合 ---------- */
    details.q-card > summary, details.result-item > summary { list-style: none; cursor: pointer; }
    details.q-card > summary::-webkit-details-marker, details.result-item > summary::-webkit-details-marker { display: none; }
    details.q-card > summary { padding-bottom: 20px; }
    details.q-card[open] > summary { padding-bottom: 0; }
    .chev { flex: none; align-self: center; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%;
      color: var(--ink-2); transition: transform .2s; }
    .chev::before { content: '▾'; font-size: 16px; }
    details[open] > summary .chev { transform: rotate(180deg); }
    summary:focus-visible { outline: 3px solid var(--blue); outline-offset: -3px; }
    .q-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

    /* 每一題的狀態 */
    .q-state { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap;
      background: var(--blue-soft); color: var(--blue-dark); }
    .q-state[data-state="todo"] { background: var(--blue-soft); color: var(--blue-dark); }
    .q-state[data-state="urgent"], .q-state[data-state="returned"] { background: var(--orange-soft); color: var(--orange); }
    .q-state[data-state="done"] { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
    .q-state[data-state="passed"] { background: var(--green-soft); color: var(--green); }
    .q-state[data-state="missed"] { background: var(--red-soft); color: var(--red); }

    /* 我的繳交情況：每一題一顆，點了跳過去 */
    .my-status { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
    .my-status button { display: inline-flex; align-items: center; gap: 6px; height: auto; min-height: 36px; padding: 4px 12px 4px 6px;
      background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 999px; font-size: 14px; font-weight: 400; max-width: 100%; }
    .my-status button:hover { background: var(--surface-2); }
    .my-status .n { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--blue-soft); color: var(--blue-dark); font-weight: 700; font-size: 13px; }
    .my-status .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12em; }
    .my-status .q-state { padding: 0 8px; font-size: 12px; }

    .q-due {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px 8px;
      margin-top: 6px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 13px;
      color: var(--ink-2);
    }

    .q-due b { color: var(--ink); }
    .q-due.soon { background: var(--orange-soft); border-color: #efd3b3; }
    .q-due.soon b { color: var(--orange); }
    .q-due.passed { background: var(--red-soft); border-color: #f0c9c3; }
    .q-due.passed b { color: var(--red); }

    .q-card.is-closed .question-title,
    .q-card.is-closed .question-content { color: var(--ink-2); }
    .q-card.is-closed textarea { background: var(--surface-2); }

    .message.warn { color: var(--orange); }

    .late-tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--red-soft);
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .r-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

    .meta { color: var(--ink-2); font-size: 14px; }
    .message { margin-top: 12px; font-weight: 700; }
    .success { color: var(--green); }
    .error { color: var(--red); }
    .empty { text-align: center; color: var(--ink-2); padding: 36px 16px; }

    /* ---------- 作答紀錄 ---------- */
    .result-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      overflow: hidden;
    }

    .r-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
    }

    .r-head h3 { margin: 0; font-size: 18px; }
    details.result-item:not([open]) > .r-head { border-bottom: 0; }
    .r-head .r-tags { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }
    .r-score { font-size: 14px; font-weight: 700; white-space: nowrap; }

    .status {
      display: inline-block;
      background: var(--blue-soft);
      color: var(--blue-dark);
      padding: 2px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status[data-status="已通過"] { background: var(--green-soft); color: var(--green); }
    .status[data-status="退回修改"] { background: var(--orange-soft); color: var(--orange); }

    .r-body { display: grid; grid-template-columns: 1fr 1fr; }
    .r-body > div { padding: 16px 22px 20px; min-width: 0; }
    .r-body > div + div { border-left: 1px solid var(--line); background: var(--surface-2); }

    .r-label { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }

    .feedback { white-space: pre-wrap; line-height: 1.8; }

    .score { font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1.2; margin-bottom: 10px; }
    .score small { font-family: var(--sans); font-size: 15px; color: var(--ink-2); font-weight: 400; }

    .waiting { color: var(--ink-2); margin: 0; }

    /* ---------- AI 即時回饋 ---------- */
    .instant {
      margin-top: 14px;
      padding: 14px 16px;
      border-left: 4px solid var(--purple);
      border-radius: 0 var(--radius-s) var(--radius-s) 0;
      background: var(--purple-soft);
    }

    .instant-title { margin: 0 0 4px; color: var(--purple); font-size: 14px; font-weight: 700; }
    .instant-text { white-space: pre-wrap; line-height: 1.8; }
    .instant.loading .instant-text { color: var(--ink-2); }
    .instant.loading .instant-text::after { content: '…'; animation: blink 1.2s steps(1) infinite; }
    .instant-note { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }

    @keyframes blink { 50% { opacity: 0; } }

    .r-instant { margin-top: 14px; }

    /* AI 學習建議分三段：已理解之處 → 待釐清之處 → 下一步提示 */
    .fb-parts { display: grid; gap: 8px; margin-top: 6px; }
    .fb-part { padding: 8px 12px; border-radius: var(--radius-s); background: var(--surface, #fff); }
    .fb-part b { display: block; font-size: 13px; color: var(--purple); margin-bottom: 2px; }
    .fb-part span { white-space: pre-wrap; line-height: 1.75; }

    /* 重新送出時：這次改了什麼、有沒有參考 AI 學習建議 */
    .revise { margin-top: 12px; padding: 12px 14px; border: 1px dashed var(--line-strong); border-radius: var(--radius-s); }
    .revise label { margin-top: 0; }
    .revise textarea { min-height: 64px; }
    .revise-q { margin: 10px 0 4px; font-size: 14px; font-weight: 700; }
    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip-group label { display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 6px 12px; min-height: 40px;
      border: 1px solid var(--line-strong); border-radius: 999px; font-weight: 400; cursor: pointer; }
    .chip-group input { width: auto; margin: 0; }
    .chip-group label:has(input:checked) { border-color: var(--purple); background: var(--purple-soft); }

    .share-tag { background: var(--green-soft, #e3f3eb); color: var(--green-dark, #1f6b45); }

    /* 課堂討論的分類：學生回覆符不符合自己的想法 */
    .cls-box { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-s); background: var(--blue-soft, #eaf1ff); }
    .cls-box p { margin: 0 0 8px; }
    .cls-box .cls-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .cls-box input[type=text] { flex: 1 1 200px; min-width: 0; margin: 0; }
    .cls-box button { min-height: 40px; }
    .cls-done { font-size: 14px; color: var(--ink-2); }
    .link-button { background: none; border: none; color: var(--blue-dark); padding: 0 4px; min-height: 0; text-decoration: underline; cursor: pointer; font-size: 14px; font-weight: 400; }

    /* 作答紀錄：之前的版本 */
    details.history { border-top: 1px solid var(--line); padding: 12px 22px 16px; }
    details.history summary { cursor: pointer; color: var(--blue-dark); font-weight: 700; font-size: 14px; }
    .history-item { margin-top: 12px; padding: 12px 14px; border: 1px dashed var(--line-strong); border-radius: var(--radius-s); }
    .history-item .h-meta { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
    .history-item .h-text { white-space: pre-wrap; line-height: 1.75; }
    .history-item .h-sub { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }

    /* ---------- 課程 ---------- */
    .course-teacher { margin: 6px 0 0; color: var(--ink-2); }

    .course-panel { padding: 22px 24px; }
    .course-panel h2 { margin: 0; font-size: 19px; }
    .course-panel > p { margin: 4px 0 16px; color: var(--ink-2); font-size: 15px; }

    .join-row { display: flex; gap: 10px; max-width: 420px; }

    .join-row input {
      flex: 1;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
      text-align: center;
    }

    .join-row input::placeholder { font-size: 15px; font-weight: 400; letter-spacing: 0; text-transform: none; }

    .course-message { min-height: 1.5em; margin-top: 8px; font-size: 14px; font-weight: 700; }
    .course-message.error { color: var(--red); }
    .course-message:empty { min-height: 0; margin: 0; }

    .my-courses { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .my-courses h3 { margin: 0 0 10px; font-size: 15px; color: var(--ink-2); }

    .course-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }

    .course-item {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--line);
      border-radius: var(--radius-s);
      background: var(--surface);
      overflow: hidden;
    }

    .course-item.current { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }

    .course-pick {
      flex: 1;
      min-width: 0;
      height: auto;
      padding: 10px 14px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      white-space: normal;
      border-radius: 0;
    }

    .course-pick:hover { background: var(--surface-2); }
    .course-pick b { display: block; font-size: 15px; line-height: 1.45; }
    .course-pick small { display: block; color: var(--ink-2); font-size: 13px; font-weight: 400; }

    .course-forget {
      flex: none;
      width: 38px;
      height: auto;
      padding: 0;
      background: transparent;
      color: var(--ink-2);
      border-left: 1px solid var(--line);
      border-radius: 0;
      font-size: 16px;
    }

    .course-forget:hover { background: var(--red-soft); color: var(--red); }

    .archived-note {
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: var(--radius-s);
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--ink-2);
    }

    @media (max-width: 1023px) {
      .identity-form { grid-template-columns: 1fr 1fr; }
      .identity-form .identity-head { grid-column: 1 / -1; }
      .identity-form .identity-actions { grid-column: 1 / -1; }
      .identity-signed .identity-actions { width: 100%; }
      .identity-actions button:not(.icon-button) { flex: 1; }
    }

    @media (max-width: 640px) {
      .join-row { max-width: none; }
      .identity-form { grid-template-columns: 1fr; }
      .question-content { margin-left: 24px; }
      .r-body { grid-template-columns: 1fr; }
      .r-body > div + div { border-left: 0; border-top: 1px solid var(--line); }
      .q-foot { flex-direction: column-reverse; align-items: stretch; }
    }
  </style>
</head>

<body>

<main class="page">

  <header class="page-header">
    <div>
      <h1 id="courseTitle">課堂問答</h1>
      <p class="course-teacher" id="courseTeacher">先輸入老師給你的課程代碼</p>
    </div>
    <div class="page-actions">
      <button type="button" class="secondary" id="switchCourseButton" onclick="toggleCoursePanel()" aria-expanded="false" aria-controls="coursePanel" hidden>切換課程</button>
    </div>
  </header>

  <section class="card course-panel" id="coursePanel" aria-labelledby="coursePanelTitle" hidden>
    <h2 id="coursePanelTitle">加入課程</h2>
    <p>輸入老師給你的 6 碼課程代碼。</p>

    <form class="join-row" id="joinForm">
      <label for="courseCode" class="visually-hidden">課程代碼</label>
      <input id="courseCode" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="例如 AB3K7Q">
      <button type="submit" id="joinButton">加入</button>
    </form>
    <div class="course-message" id="courseMessage" role="status"></div>

    <div class="my-courses" id="myCourses" hidden>
      <h3>我加入過的課程</h3>
      <div class="course-list" id="courseList"></div>
    </div>
  </section>

  <section class="card identity" aria-label="我的資料">

    <!-- 還沒確認身分 -->
    <div class="identity-form" id="identityForm">
      <div class="identity-head">
        <strong>輸入學號與姓名</strong>
        <span>換電腦或手機時，輸入同一組就能接著作答</span>
      </div>

      <div class="student-grid-item">
        <label for="studentId">學號</label>
        <input id="studentId" autocomplete="username" placeholder="請輸入學號">
      </div>

      <div class="student-grid-item">
        <label for="name">姓名</label>
        <input id="name" autocomplete="name" placeholder="請輸入姓名">
      </div>

      <div class="identity-actions">
        <button type="button" onclick="saveIdentity()">確認</button>
      </div>
    </div>

    <!-- 已確認身分 -->
    <div class="identity-signed" id="identitySigned" hidden>
      <span class="avatar" id="identityAvatar" aria-hidden="true"></span>
      <div class="signed-text">
        <strong id="identityName"></strong>
        <span id="identityMeta"></span>
      </div>
      <div class="identity-actions">
        <button type="button" class="secondary" id="viewResultsButton" onclick="loadMyResults()">查看審核結果</button>
        <button type="button" class="secondary icon-button" onclick="refreshStudentPage()" title="重新整理" aria-label="重新整理">🔄</button>
        <button type="button" class="secondary" onclick="signOutStudent()" title="讓這台裝置忘記你的學號和姓名">換人</button>
      </div>
    </div>

  </section>

  <div class="line-tabs" role="tablist">
    <button type="button" role="tab" id="tabQuestions" aria-controls="panelQuestions" aria-selected="true">
      老師的問題<span class="tab-count" id="questionCount" hidden></span>
    </button>
    <button type="button" role="tab" id="tabResults" aria-controls="panelResults" aria-selected="false">
      我的作答紀錄
    </button>
  </div>

  <section id="panelQuestions" role="tabpanel" aria-labelledby="tabQuestions">
    <div id="todoBanner" class="todo-banner" role="status" hidden></div>
    <div id="questionList">
      <div class="card empty">題目載入中……</div>
    </div>
  </section>

  <section id="panelResults" role="tabpanel" aria-labelledby="tabResults" hidden>
    <div id="myResults">
      <div class="card empty">請輸入學號與姓名，再按「確認」</div>
    </div>
  </section>

</main>


<script>

  document.addEventListener('DOMContentLoaded', function() {

    restoreIdentity();
    setupCourses();

    // 在學號、姓名欄按 Enter 就確認
    ['studentId', 'name'].forEach(function(id) {
      document.getElementById(id).addEventListener('keydown', function(event) {
        if (event.key === 'Enter') saveIdentity();
      });
    });
  });


  function refreshStudentPage() {

    loadQuestions();

    const identity = getIdentity();

    if (identity.studentId && identity.name) {
      loadMyResults();
    }
  }


  /* ==================================================
     課程
     學生輸入老師給的加入代碼，或點老師分享的連結（student.html?course=代碼）。
     這台裝置會記住加入過的課程，下次直接選。
  ================================================== */

  const COURSES_KEY = 'classroom_courses';
  const CURRENT_COURSE_KEY = 'classroom_course';

  let currentCourse = null;


  function readJoinedCourses() {
    try {
      const list = JSON.parse(localStorage.getItem(COURSES_KEY) || '[]');
      return Array.isArray(list) ? list.filter(function(c) { return c && c.code; }) : [];
    } catch (error) {
      return [];
    }
  }


  function saveJoinedCourses(list) {
    try {
      localStorage.setItem(COURSES_KEY, JSON.stringify(list));
    } catch (error) {
      // 無痕視窗可能不能存，這一次仍可使用
    }
  }


  function rememberCourse(course) {
    const list = readJoinedCourses().filter(function(c) { return c.code !== course.code; });
    list.unshift({ code: course.code, name: course.name, teacherName: course.teacherName, archived: !!course.archived });
    saveJoinedCourses(list.slice(0, 20));
    try { localStorage.setItem(CURRENT_COURSE_KEY, course.code); } catch (error) { /* 忽略 */ }
  }


  function forgetCourse(code) {

    saveJoinedCourses(readJoinedCourses().filter(function(c) { return c.code !== code; }));

    if (currentCourse && currentCourse.code === code) {
      try { localStorage.removeItem(CURRENT_COURSE_KEY); } catch (error) { /* 忽略 */ }
      setCurrentCourse(null);
    }

    renderCourseList();
  }


  function setupCourses() {

    document.getElementById('joinForm').addEventListener('submit', function(event) {
      event.preventDefault();
      joinCourse(document.getElementById('courseCode').value);
    });

    // 老師分享的連結：student.html?course=代碼
    const params = new URLSearchParams(window.location.search);
    const linkCode = params.get('course');

    if (linkCode) {
      params.delete('course');
      const rest = params.toString();
      try {
        history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : '') + window.location.hash);
      } catch (error) { /* 忽略 */ }
      joinCourse(linkCode);
      return;
    }

    let savedCode = '';
    try { savedCode = localStorage.getItem(CURRENT_COURSE_KEY) || ''; } catch (error) { savedCode = ''; }

    const saved = readJoinedCourses().find(function(c) { return c.code === savedCode; });

    if (!saved) {
      setCurrentCourse(null);
      return;
    }

    // 先用記住的資料顯示，再向伺服器確認代碼還有效
    setCurrentCourse(saved);
    refreshCourseInfo(saved);
  }


  /*
   * 向伺服器確認記住的課程還有效，順便更新課程名稱與狀態。
   * 老師換過代碼的話，舊代碼就找不到了。
   */
  function refreshCourseInfo(saved) {

    google.script.run
      .withSuccessHandler(function(course) {
        rememberCourse(course);
        if (currentCourse && currentCourse.code === course.code) {
          const archivedChanged = course.archived !== !!currentCourse.archived;
          currentCourse = course;
          showCourseHeader();
          renderCourseList();
          if (archivedChanged) loadQuestions();
        }
      })
      .withFailureHandler(function(error) {
        if (/找不到/.test(error.message)) {
          forgetCourse(saved.code);
          openCoursePanel(true);
          showCourseMessage('「' + saved.name + '」的課程代碼已經更換，請向老師索取新的代碼。', true);
        }
      })
      .getCourseByCode(saved.code);
  }


  function joinCourse(code) {

    code = String(code || '').trim().toUpperCase().replace(/[\s-]/g, '');

    if (!code) {
      showCourseMessage('請輸入課程代碼', true);
      document.getElementById('courseCode').focus();
      return;
    }

    const button = document.getElementById('joinButton');
    button.disabled = true;
    button.textContent = '查詢中……';
    showCourseMessage('', false);
    openCoursePanel(true);

    google.script.run
      .withSuccessHandler(function(course) {
        button.disabled = false;
        button.textContent = '加入';
        document.getElementById('courseCode').value = '';
        rememberCourse(course);
        setCurrentCourse(course);
      })
      .withFailureHandler(function(error) {
        button.disabled = false;
        button.textContent = '加入';
        showCourseMessage(error.message, true);
        document.getElementById('courseCode').value = code;
        document.getElementById('courseCode').select();
      })
      .getCourseByCode(code);
  }


  function setCurrentCourse(course) {

    const changed = (currentCourse && currentCourse.code) !== (course && course.code);

    currentCourse = course;

    try {
      if (course) localStorage.setItem(CURRENT_COURSE_KEY, course.code);
    } catch (error) { /* 忽略 */ }

    showCourseHeader();
    renderCourseList();
    openCoursePanel(!course);

    if (!changed && course) {
      return;
    }

    // 換課程：清掉上一門課的作答
    Object.keys(myAnswers).forEach(function(key) { delete myAnswers[key]; });
    myAnswersReady = false;

    loadQuestions();

    const identity = getIdentity();

    if (course && identity.studentId && identity.name) {
      loadMyResults();
    } else {
      document.getElementById('myResults').innerHTML = course
        ? '<div class="card empty">請輸入學號與姓名，再按「確認」</div>'
        : '<div class="card empty">請先加入課程</div>';
    }
  }


  function showCourseHeader() {

    const title = document.getElementById('courseTitle');
    const teacher = document.getElementById('courseTeacher');
    const switchButton = document.getElementById('switchCourseButton');

    if (!currentCourse) {
      title.textContent = '課堂問答';
      teacher.textContent = '先輸入老師給你的課程代碼';
      switchButton.hidden = true;
      document.title = '課堂問答｜AI 課堂';
      return;
    }

    title.textContent = currentCourse.name;
    teacher.textContent =
      (currentCourse.teacherName ? '授課教師：' + currentCourse.teacherName : '課堂問答') +
      (currentCourse.archived ? '・課程已結束' : '');
    switchButton.hidden = false;
    document.title = currentCourse.name + '｜AI 課堂';
  }


  function renderCourseList() {

    const list = readJoinedCourses();
    const box = document.getElementById('courseList');

    document.getElementById('myCourses').hidden = list.length === 0;

    box.innerHTML = list.map(function(c) {
      const isCurrent = currentCourse && currentCourse.code === c.code;
      return '<div class="course-item' + (isCurrent ? ' current' : '') + '">' +
        '<button type="button" class="course-pick" data-code="' + escapeHtml(c.code) + '"' +
        (isCurrent ? ' aria-current="true"' : '') + '>' +
        '<b>' + escapeHtml(c.name) + '</b>' +
        '<small>' + escapeHtml((c.teacherName || '') + (isCurrent ? '・目前的課程' : c.archived ? '・已結束' : '')) + '</small>' +
        '</button>' +
        '<button type="button" class="course-forget" data-forget="' + escapeHtml(c.code) + '"' +
        ' title="從這台裝置移除" aria-label="從這台裝置移除「' + escapeHtml(c.name) + '」">×</button>' +
        '</div>';
    }).join('');

    box.querySelectorAll('[data-code]').forEach(function(button) {
      button.addEventListener('click', function() {
        const picked = readJoinedCourses().find(function(c) { return c.code === button.dataset.code; });
        if (picked) {
          showCourseMessage('', false);
          setCurrentCourse(picked);
          refreshCourseInfo(picked);
        }
      });
    });

    box.querySelectorAll('[data-forget]').forEach(function(button) {
      button.addEventListener('click', function() {
        forgetCourse(button.dataset.forget);
      });
    });
  }


  function openCoursePanel(open) {
    document.getElementById('coursePanel').hidden = !open;
    document.getElementById('switchCourseButton').setAttribute('aria-expanded', String(!!open));
  }


  function toggleCoursePanel() {
    const panel = document.getElementById('coursePanel');
    openCoursePanel(panel.hidden);
    if (!panel.hidden) document.getElementById('courseCode').focus();
  }


  function showCourseMessage(text, isError) {
    const box = document.getElementById('courseMessage');
    box.textContent = text;
    box.className = 'course-message' + (isError ? ' error' : '');
  }


  function getIdentity() {
    return {
      studentId: document.getElementById('studentId').value.trim(),
      name: document.getElementById('name').value.trim()
    };
  }


  /* ==================================================
     學生身分
     作答都存在試算表裡；這台裝置只記住學號和姓名，方便下次不用再打。
     換電腦或手機時，輸入同一組學號和姓名就會讀回自己的作答。
  ================================================== */

  // 題目ID → 自己在這一題最新的一筆作答
  const myAnswers = {};

  // 自己的作答讀回來之前，先不顯示「還沒交」的提醒，免得誤報
  let myAnswersReady = false;


  function rememberIdentity(data) {
    try {
      localStorage.setItem('classroom_identity', JSON.stringify(data));
    } catch (error) {
      // 無痕視窗可能不能存，這一頁仍可使用
    }
  }


  function showIdentityState() {

    const identity = getIdentity();
    const signed = !!(identity.studentId && identity.name);

    document.getElementById('identityForm').hidden = signed;
    document.getElementById('identitySigned').hidden = !signed;

    if (signed) {
      document.getElementById('identityAvatar').textContent = identity.name.charAt(0);
      document.getElementById('identityName').textContent = identity.name;
      updateIdentityMeta();
    }

    updateReminders();
  }


  function updateIdentityMeta() {

    const identity = getIdentity();
    const cards = document.querySelectorAll('.q-card');
    let answered = 0;

    cards.forEach(function(card) {
      if (myAnswers[card.dataset.id]) answered++;
    });

    document.getElementById('identityMeta').textContent =
      '學號 ' + identity.studentId + (cards.length ? '・已作答 ' + answered + '／' + cards.length + ' 題' : '');
  }


  function saveIdentity() {

    const data = getIdentity();

    if (!data.studentId || !data.name) {
      alert('請完整填寫學號與姓名');
      return;
    }

    rememberIdentity(data);
    myAnswersReady = false;
    showIdentityState();

    if (currentCourse) {
      loadMyResults();
    }
  }


  function restoreIdentity() {

    let saved = null;

    try {
      saved = localStorage.getItem('classroom_identity');
    } catch (error) {
      saved = null;
    }

    if (saved) {
      try {
        const data = JSON.parse(saved);
        document.getElementById('studentId').value = data.studentId || '';
        document.getElementById('name').value = data.name || '';
      } catch (error) {
        console.log(error);
      }
    }

    showIdentityState();
  }


  // 共用電腦用完按「換人」：這台裝置忘記學號姓名，畫面上的作答也清掉。作答本身不會刪除。
  function signOutStudent() {

    if (!confirm('要換人嗎？\n\n這台裝置會忘記你的學號和姓名，畫面上的作答也會清掉。\n你交過的作答都還在，之後輸入同一組學號姓名就能看到。')) {
      return;
    }

    try {
      localStorage.removeItem('classroom_identity');
    } catch (error) {
      // 忽略
    }

    document.getElementById('studentId').value = '';
    document.getElementById('name').value = '';

    Object.keys(myAnswers).forEach(function(key) {
      delete myAnswers[key];
    });

    myAnswersReady = false;

    document.getElementById('myResults').innerHTML =
      '<div class="card empty">請輸入學號與姓名，再按「確認」</div>';

    showIdentityState();
    document.getElementById('tabQuestions').click();
    loadQuestions();
    document.getElementById('studentId').focus();
    fillMyAnswers();
  }


  // 把自己交過的答案放回每一題的作答框，並顯示批改狀態
  function applyMyAnswers(results) {

    Object.keys(myAnswers).forEach(function(key) {
      delete myAnswers[key];
    });

    (results || []).forEach(function(item) {
      // 後端回傳的是新的在前，同一題只留最新一筆
      if (item.questionId && !myAnswers[item.questionId]) {
        myAnswers[item.questionId] = item;
      }
    });

    myAnswersReady = true;
    fillMyAnswers();
  }


  function fillMyAnswers() {

    document.querySelectorAll('.q-card').forEach(function(card) {

      const id = card.dataset.id;
      const mine = myAnswers[id];
      const box = document.getElementById('mine_' + id);
      const textarea = document.getElementById('answer_' + id);
      const button = document.getElementById('submit_' + id);

      if (!box || !textarea || !button) return;

      if (!mine) {
        box.hidden = true;
        const reviseBox = document.getElementById('revise_' + id);
        if (reviseBox) reviseBox.hidden = true;
        const instantBox = document.getElementById('instant_' + id);
        if (instantBox && !instantBox.classList.contains('loading')) instantBox.hidden = true;
        return;
      }

      // 學生正在打字時不要蓋掉
      if (!textarea.value.trim() || textarea.dataset.prefilled === 'true') {
        textarea.value = mine.answer || '';
        textarea.dataset.prefilled = 'true';
      }

      const time = String(mine.submittedAt || '').replace(/:\d\d$/, '');
      let text = '✓ 你已在 ' + time + ' 送出' + (mine.version > 1 ? '（第 ' + mine.version + ' 次）' : '') +
        (mine.late ? '（遲交）' : '') + '・' + mine.status;

      // 存好的 AI 即時回饋（正在等新回饋時不要蓋掉）
      const instantBox = document.getElementById('instant_' + id);
      if (instantBox && !instantBox.classList.contains('loading') && mine.instantFeedback) {
        showInstant(id, mine.instantFeedback, '');
      }
      let extra = '';

      box.className = 'mine';

      if (mine.status === '已通過') {

        box.classList.add('passed');
        text += '。老師已審核通過，不能再修改，分數與評語請看「我的作答紀錄」。';
        textarea.readOnly = true;
        button.disabled = true;
        button.textContent = '已審核通過';

      } else {

        textarea.readOnly = false;

        if (mine.status === '退回修改') {
          box.classList.add('returned');
          text = '↩ 老師請你修改後再送出一次';
          if (mine.teacherFeedback) {
            extra = '<span class="mine-feedback">老師的評語：' + escapeHtml(mine.teacherFeedback) + '</span>';
          }
        }

        if (!card.classList.contains('is-closed')) {
          button.textContent = '重新送出';
        }
      }

      box.innerHTML = escapeHtml(text) + extra;
      box.hidden = false;

      const revise = document.getElementById('revise_' + id);
      if (revise) revise.hidden = mine.status === '已通過' || card.classList.contains('is-closed');
    });

    if (!document.getElementById('identitySigned').hidden) {
      updateIdentityMeta();
    }

    updateReminders();
  }


  function loadQuestions() {

    const list = document.getElementById('questionList');

    if (!currentCourse) {
      list.innerHTML = '<div class="card empty">輸入課程代碼加入課程後，這裡會出現老師的問題。</div>';
      updateReminders();
      return;
    }

    const code = currentCourse.code;
    list.innerHTML = '<div class="card empty">題目載入中……</div>';

    google.script.run
      .withSuccessHandler(function(questions) {
        // 等待期間換了課程，就不要顯示舊課程的題目
        if (!currentCourse || currentCourse.code !== code) return;
        renderQuestions(questions);
      })
      .withFailureHandler(function(error) {
        if (!currentCourse || currentCourse.code !== code) return;
        list.innerHTML =
          '<div class="card error">題目讀取失敗：' + escapeHtml(error.message) + '</div>';
      })
      .getPublishedQuestions(code);
  }


  function renderQuestions(questions) {

    const list = document.getElementById('questionList');

    if (currentCourse && currentCourse.archived) {
      list.innerHTML = '<div class="archived-note">這門課程已經結束，不能再作答。你的作答和老師的評語可以在「我的作答紀錄」查看。</div>';
      updateReminders();
      return;
    }

    if (!questions || questions.length === 0) {
      list.innerHTML = '<div class="card empty">老師目前沒有發布題目。</div>';
      updateReminders();
      return;
    }

    list.innerHTML = '';

    // 還能作答的排前面，已截止的排後面
    questions = questions.slice().sort(function(a, b) {
      return Number(isClosed(a)) - Number(isClosed(b));
    });

    questions.forEach(function(q, index) {

      const card = document.createElement('details');
      card.className = 'card q-card';
      // 只有一題時直接展開；其他時候收起來，點標題再展開
      card.open = questions.length === 1;
      card.dataset.id = q.id;
      card.dataset.deadline = q.deadline || '';
      card.dataset.allowLate = q.allowLate ? 'true' : 'false';
      card.dataset.title = q.title || '';
      card.dataset.count = q.submittedCount == null ? '' : q.submittedCount;
      card.dataset.instant = q.instantFeedback ? 'true' : 'false';

      card.innerHTML = `
        <summary class="q-head">
          <span class="q-num">${index + 1}</span>
          <div class="q-titles">
            <div class="question-title">${escapeHtml(q.title)}</div>
            <div class="q-meta">
              ${q.deadline ? '<span class="q-due"></span>' : ''}
              ${q.submittedCount == null ? '' : '<span class="q-count"></span>'}
            </div>
          </div>
          <span class="q-side">
            ${q.descriptive
              ? '<span class="points share-tag" title="這一題是分享，沒有對錯，老師不打分數">分享・不評分</span>'
              : `<span class="points">${escapeHtml(q.points)} 分</span>`}
            <span class="q-state" id="state_${q.id}" hidden></span>
          </span>
          <span class="chev" aria-hidden="true"></span>
        </summary>
        <div class="question-content">${escapeHtml(q.content)}</div>

        <div class="q-answer">
          <div class="mine" id="mine_${q.id}" hidden></div>
          <div class="nudge" id="nudge_${q.id}" hidden></div>
          <label for="answer_${q.id}">我的回答</label>
          <textarea id="answer_${q.id}" placeholder="請在這裡輸入你的回答……"
            oninput="this.dataset.prefilled = 'false'"></textarea>

          <div class="revise" id="revise_${q.id}" hidden>
            <label for="revisionNote_${q.id}">這次改了什麼？為什麼這樣改？（選填）</label>
            <textarea id="revisionNote_${q.id}" maxlength="300" placeholder="例如：補上熱是從哪裡傳到哪裡"></textarea>
            ${q.instantFeedback ? `
            <p class="revise-q" id="adoptQ_${q.id}">修改時有參考 AI 學習建議嗎？</p>
            <div class="chip-group" role="radiogroup" aria-labelledby="adoptQ_${q.id}">
              <label><input type="radio" name="adopt_${q.id}" value="有參考"> 有參考</label>
              <label><input type="radio" name="adopt_${q.id}" value="部分參考"> 部分參考</label>
              <label><input type="radio" name="adopt_${q.id}" value="沒有參考"> 沒有參考</label>
            </div>` : ''}
          </div>

          <div class="q-foot">
            <div id="message_${q.id}" class="message"></div>
            <button type="button" id="submit_${q.id}" onclick="submitAnswer('${q.id}')">送出回答</button>
          </div>

          <div class="instant" id="instant_${q.id}" role="status" aria-live="polite" hidden></div>
        </div>
      `;

      list.appendChild(card);
    });

    refreshDeadlines();
    fillMyAnswers();
  }


  /* ==================================================
     截止時間
     畫面上的倒數用電腦的時間；能不能交，最後以伺服器為準。
  ================================================== */

  const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function formatDeadline(time) {
    const d = new Date(Number(time));
    const year = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '/' : '';
    return year + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()) +
      '（' + WEEKDAYS[d.getDay()] + '）' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function remainingText(time) {

    const diff = Number(time) - Date.now();

    if (diff <= 0) return '已截止';

    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(minutes / 60);

    if (minutes < 60) return '剩 ' + Math.max(minutes, 1) + ' 分鐘';
    if (hours < 48) return '剩 ' + hours + ' 小時';
    return '剩 ' + Math.floor(hours / 24) + ' 天';
  }

  function isClosed(q) {
    return !!q.deadline && Date.now() > Number(q.deadline) && !q.allowLate;
  }

  // 更新每一題的倒數；時間到了就停用作答
  function refreshDeadlines() {

    document.querySelectorAll('.q-card[data-deadline]').forEach(function(card) {

      const deadline = Number(card.dataset.deadline);

      if (!deadline) return;

      const id = card.dataset.id;
      const allowLate = card.dataset.allowLate === 'true';
      const diff = deadline - Date.now();
      const passed = diff <= 0;
      const due = card.querySelector('.q-due');

      due.className = 'q-due' + (passed ? ' passed' : diff < 24 * 3600 * 1000 ? ' soon' : '');
      due.innerHTML = '⏰ 截止 ' + escapeHtml(formatDeadline(deadline)) +
        '<b>' + escapeHtml(passed ? (allowLate ? '已截止，仍可遲交' : '已截止') : remainingText(deadline)) + '</b>';

      const textarea = document.getElementById('answer_' + id);
      const button = document.getElementById('submit_' + id);
      const message = document.getElementById('message_' + id);
      const closed = passed && !allowLate;

      card.classList.toggle('is-closed', closed);

      if (closed) {
        textarea.disabled = true;
        button.disabled = true;
        button.textContent = '已截止';
        if (!message.textContent) {
          message.className = 'message error';
          message.textContent = '已超過截止時間，無法再繳交';
        }
      } else if (passed && !message.textContent) {
        message.className = 'message warn';
        message.textContent = '已過截止時間，現在送出會標示為遲交';
      }
    });

    updateReminders();
  }


  /* ==================================================
     繳交人數與催交提醒
     只顯示人數，不會顯示誰交了。
     知道學號姓名後，才知道自己哪幾題還沒交。
  ================================================== */

  function isSignedIn() {
    const identity = getIdentity();
    return myAnswersReady && !!(identity.studentId && identity.name) &&
      !document.getElementById('identitySigned').hidden;
  }


  function updateReminders() {

    const signed = isSignedIn();
    const pending = [];

    document.querySelectorAll('.q-card').forEach(function(card) {

      const id = card.dataset.id;
      const count = card.dataset.count === '' ? null : Number(card.dataset.count);
      const deadline = Number(card.dataset.deadline) || 0;
      const passed = !!deadline && Date.now() > deadline;
      const closed = card.classList.contains('is-closed');
      const done = !!myAnswers[id];

      // 標題下方的人數
      const countBox = card.querySelector('.q-count');

      if (countBox && count != null) {
        countBox.innerHTML = count > 0
          ? '👥 已有<b>' + count + '</b>人繳交'
          : '👥 還沒有人繳交';
      }

      // 標題右邊的狀態
      const stateBox = document.getElementById('state_' + id);
      const st = questionState(card, signed);
      if (stateBox) {
        stateBox.hidden = !st;
        if (st) { stateBox.textContent = st.label; stateBox.dataset.state = st.key; }
      }

      // 作答區上方的提醒：只給已確認身分、還沒交、還能交的題目
      const nudge = document.getElementById('nudge_' + id);

      if (!nudge) return;

      if (!signed || done || closed || passed) {
        nudge.hidden = true;
        return;
      }

      pending.push({ card: card, deadline: deadline });

      const others = count > 0 ? '已經有 ' + count + ' 位同學交了，' : '';
      const urgent = !!deadline && deadline - Date.now() < 24 * 3600 * 1000;

      if (deadline) {
        nudge.textContent = '⏰ 你還沒交這一題！' + others +
          '截止時間是 ' + formatDeadline(deadline) + '，' + remainingText(deadline) + '。';
      } else if (count > 0) {
        nudge.textContent = '✏️ 你還沒交這一題，' + others + '也來寫寫看吧。';
      } else {
        nudge.hidden = true;
        return;
      }

      nudge.className = 'nudge' + (urgent ? ' urgent' : '');
      nudge.hidden = false;
    });

    updateTodoBanner(signed, pending);
  }


  /*
   * 這一題對這位學生來說是什麼狀態。
   */
  function questionState(card, signed) {

    if (!signed || !myAnswersReady) return null;

    const mine = myAnswers[card.dataset.id];
    const deadline = Number(card.dataset.deadline) || 0;
    const passed = !!deadline && Date.now() > deadline;

    if (!mine) {
      if (card.classList.contains('is-closed') || passed && card.dataset.allowLate !== 'true') return { key: 'missed', label: '未交・已截止' };
      if (passed) return { key: 'urgent', label: '未交・可遲交' };
      if (deadline && deadline - Date.now() < 24 * 3600 * 1000) return { key: 'urgent', label: '未交・快截止' };
      return { key: 'todo', label: '未交' };
    }

    if (mine.status === '已通過') return { key: 'passed', label: '已通過' };
    if (mine.status === '退回修改') return { key: 'returned', label: '請修改' };

    return { key: 'done', label: '已交' + (mine.version > 1 ? '・第 ' + mine.version + ' 次' : '') };
  }


  /*
   * 「我的繳交情況」：每一題一顆，點了跳到那一題並展開。
   */
  function myStatusHtml(signed) {

    const cards = Array.prototype.slice.call(document.querySelectorAll('.q-card'));

    if (!signed || !myAnswersReady || !cards.length) return '';

    return '<div class="my-status" aria-label="我的繳交情況">' + cards.map(function(card, i) {
      const st = questionState(card, signed);
      return '<button type="button" onclick="goToQuestion(\'' + card.dataset.id + '\')" title="跳到這一題">' +
        '<span class="n">' + (i + 1) + '</span><span class="t">' + escapeHtml(card.dataset.title) + '</span>' +
        (st ? '<span class="q-state" data-state="' + st.key + '">' + escapeHtml(st.label) + '</span>' : '') +
        '</button>';
    }).join('') + '</div>';
  }


  function updateTodoBanner(signed, pending) {

    const banner = document.getElementById('todoBanner');
    const total = document.querySelectorAll('.q-card').length;

    if (!signed || !total) {
      banner.hidden = true;
      return;
    }

    if (!pending.length) {
      banner.className = 'todo-banner done';
      banner.innerHTML = '<div class="todo-text"><strong>🎉 目前開放的題目你都交了</strong>' +
        '<span>老師批改後，可以到「我的作答紀錄」看分數和評語。點下面的題目可以跳過去看。</span></div>' +
        myStatusHtml(signed);
      banner.hidden = false;
      return;
    }

    // 最快截止的一題
    const withDeadline = pending
      .filter(function(item) { return item.deadline; })
      .sort(function(a, b) { return a.deadline - b.deadline; });

    const first = withDeadline[0] || pending[0];
    const urgent = !!first.deadline && first.deadline - Date.now() < 24 * 3600 * 1000;

    const detail = first.deadline
      ? '最快截止：「' + first.card.dataset.title + '」' + formatDeadline(first.deadline) +
        '（' + remainingText(first.deadline) + '）'
      : '這幾題沒有截止時間，但還是早點完成比較安心。';

    banner.className = 'todo-banner' + (urgent ? ' urgent' : '');
    banner.innerHTML =
      '<div class="todo-text"><strong>⏰ 你還有 ' + pending.length + ' 題沒交</strong>' +
      '<span>' + escapeHtml(detail) + '</span></div>' +
      '<button type="button" onclick="goToQuestion(\'' + first.card.dataset.id + '\')">去寫這一題</button>' +
      myStatusHtml(signed);
    banner.hidden = false;
  }


  function goToQuestion(id) {

    const card = document.querySelector('.q-card[data-id="' + id + '"]');

    if (!card) return;

    // 從作答紀錄點過來時，先切回「老師的問題」
    if (document.getElementById('panelQuestions').hidden) {
      document.getElementById('tabQuestions').click();
    }

    card.open = true;
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    card.classList.add('highlight');
    setTimeout(function() { card.classList.remove('highlight'); }, 1600);

    const textarea = document.getElementById('answer_' + id);
    if (textarea && !textarea.disabled) textarea.focus({ preventScroll: true });
  }

  setInterval(refreshDeadlines, 30 * 1000);


  function submitAnswer(questionId) {

    const identity = getIdentity();

    if (!identity.studentId || !identity.name) {
      alert('請先輸入學號與姓名');
      return;
    }

    const answer = document.getElementById('answer_' + questionId).value.trim();

    if (!answer) {
      alert('請先輸入回答');
      return;
    }

    rememberIdentity(identity);
    showIdentityState();

    const button = document.getElementById('submit_' + questionId);
    const message = document.getElementById('message_' + questionId);

    // 重新送出才有修改說明
    const reviseBox = document.getElementById('revise_' + questionId);
    const revising = !!myAnswers[questionId] && reviseBox && !reviseBox.hidden;
    const noteBox = document.getElementById('revisionNote_' + questionId);
    const adopted = document.querySelector('input[name="adopt_' + questionId + '"]:checked');

    button.disabled = true;
    button.textContent = '送出中……';
    message.textContent = '';

    google.script.run
      .withSuccessHandler(function(result) {
        button.disabled = false;
        button.textContent = '重新送出';
        message.className = 'message success';
        message.textContent = (result.updated ? '✓ 回答已更新，之前的回答也保留著' : '✓ 回答已送出') + (result.late ? '（遲交）' : '');

        // 修改說明送出後清空，下次修改再填
        if (noteBox) noteBox.value = '';
        if (adopted) adopted.checked = false;

        if (result.instantFeedback) {
          fetchInstantFeedback(questionId, result.answerId, identity);
        } else {
          document.getElementById('instant_' + questionId).hidden = true;
        }
        // 第一次交：這一題的繳交人數加一
        const card = document.querySelector('.q-card[data-id="' + questionId + '"]');
        if (!result.updated && card && card.dataset.count !== '') {
          card.dataset.count = Number(card.dataset.count) + 1;
        }

        // 更新這一題的狀態與作答紀錄
        loadMyResults();
      })
      .withFailureHandler(function(error) {
        button.disabled = false;
        button.textContent = '送出回答';
        message.className = 'message error';
        message.textContent = '送出失敗：' + error.message;
        // 剛好在截止時被擋下，馬上把這一題停用
        refreshDeadlines();
      })
      .submitAnswer({
        studentId: identity.studentId,
        name: identity.name,
        questionId: questionId,
        answer: answer,
        courseCode: currentCourse ? currentCourse.code : '',
        revisionNote: revising && noteBox ? noteBox.value.trim() : '',
        aiAdopted: revising && adopted ? adopted.value : ''
      });
  }


  /* ==================================================
     AI 即時回饋
     送出後向伺服器要回饋。AI 忙碌時，回饋稍後會出現在「我的作答紀錄」。
  ================================================== */

  function showInstant(questionId, text, note, loading) {

    const box = document.getElementById('instant_' + questionId);

    if (!box) return;

    box.className = 'instant' + (loading ? ' loading' : '');
    box.innerHTML =
      '<p class="instant-title">🤖 AI 學習建議</p>' +
      (loading ? '<div class="instant-text">' + escapeHtml(text) + '</div>' : feedbackHtml(text)) +
      (note ? '<p class="instant-note">' + escapeHtml(note) + '</p>' : '');
    box.hidden = false;
  }


  /*
   * AI 學習建議存成「【已理解之處】……【待釐清之處】……【下一步提示】……」，分段顯示。
   * 舊的回饋沒有【】，就整段顯示。
   */
  function feedbackHtml(text) {

    const parts = String(text || '').split(/【([^】]{2,10})】/);

    if (parts.length < 3) {
      return '<div class="instant-text">' + escapeHtml(text) + '</div>';
    }

    let html = parts[0].trim() ? '<div class="instant-text">' + escapeHtml(parts[0].trim()) + '</div>' : '';

    html += '<div class="fb-parts">';
    for (let i = 1; i < parts.length; i += 2) {
      html += '<div class="fb-part"><b>' + escapeHtml(parts[i]) + '</b><span>' + escapeHtml((parts[i + 1] || '').trim()) + '</span></div>';
    }
    return html + '</div>';
  }


  function fetchInstantFeedback(questionId, answerId, identity) {

    showInstant(questionId, 'AI 正在讀你的回答', '', true);

    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.feedback) {
          showInstant(questionId, result.feedback, '這是 AI 給你的學習建議，不是分數。要不要照著改由你決定；老師審核後的評語會出現在「我的作答紀錄」。');
          if (myAnswers[questionId]) myAnswers[questionId].instantFeedback = result.feedback;
        } else if (result && result.pending) {
          showInstant(questionId, result.message, '');
        } else {
          document.getElementById('instant_' + questionId).hidden = true;
        }
      })
      .withFailureHandler(function(error) {
        // 舊版後端沒有這個功能時，不顯示任何東西
        if (/不允許呼叫的功能/.test(error.message)) {
          document.getElementById('instant_' + questionId).hidden = true;
          return;
        }
        showInstant(questionId, 'AI 學習建議暫時拿不到（' + error.message + '）。稍後會出現在「我的作答紀錄」。', '');
      })
      .requestInstantFeedback({
        answerId: answerId,
        studentId: identity.studentId,
        name: identity.name
      });
  }


  function loadMyResults() {

    const identity = getIdentity();

    if (!identity.studentId || !identity.name) {
      alert('請先輸入學號與姓名');
      return;
    }

    const box = document.getElementById('myResults');

    if (!currentCourse) {
      box.innerHTML = '<div class="card empty">請先加入課程</div>';
      return;
    }

    const code = currentCourse.code;
    box.innerHTML = '<div class="card empty">讀取中……</div>';

    google.script.run
      .withSuccessHandler(function(results) {
        if (!currentCourse || currentCourse.code !== code) return;
        renderMyResults(results);
        applyMyAnswers(results);
      })
      .withFailureHandler(function(error) {
        if (!currentCourse || currentCourse.code !== code) return;
        box.innerHTML = '<div class="card error">' + escapeHtml(error.message) + '</div>';
      })
      .getStudentResults({
        studentId: identity.studentId,
        name: identity.name,
        courseCode: code
      });
  }


  function renderMyResults(results) {

    const box = document.getElementById('myResults');

    if (!results || results.length === 0) {
      box.innerHTML = '<div class="card empty">這門課還沒有作答紀錄。<br>' +
        '如果你在其他電腦或手機作答過，請確認學號和姓名跟當時輸入的完全一樣。</div>';
      return;
    }

    box.innerHTML = '';

    results.forEach(function(item) {

      const div = document.createElement('details');
      div.className = 'result-item';
      // 被退回的要馬上看到老師的評語
      div.open = item.status === '退回修改';

      let reviewHtml = '';

      if ((item.status === '已通過' || item.status === '退回修改') && item.descriptive) {

        reviewHtml = `
          <div class="r-label">老師的回應</div>
          <div class="feedback">${escapeHtml(item.teacherFeedback || '老師尚未留下回應')}</div>
        `;

      } else if (item.status === '已通過' || item.status === '退回修改') {

        const scoreText =
          item.teacherScore !== '' && item.teacherScore != null
            ? escapeHtml(item.teacherScore) + ' / ' + escapeHtml(item.points)
            : '尚未給分';

        reviewHtml = `
          <div class="r-label">教師分數</div>
          <div class="score">${scoreText}</div>
          <div class="r-label">教師評語</div>
          <div class="feedback">${escapeHtml(item.teacherFeedback || '老師尚未留下評語')}</div>
        `;

      } else {

        reviewHtml = '<div class="r-label">教師回饋</div><p class="waiting">老師目前正在審核這份回答。</p>';
      }

      const scoreShort = !item.descriptive && (item.status === '已通過' || item.status === '退回修改') &&
        item.teacherScore !== '' && item.teacherScore != null
          ? `<span class="r-score">${escapeHtml(item.teacherScore)} / ${escapeHtml(item.points)}</span>` : '';

      div.innerHTML = `
        <summary class="r-head">
          <h3>${escapeHtml(item.title)}</h3>
          <div class="r-tags">
            ${scoreShort}
            ${item.late ? `<span class="late-tag" title="截止時間 ${escapeHtml(item.deadlineText)}">遲交</span>` : ''}
            <span class="status" data-status="${escapeHtml(item.status)}">${escapeHtml(item.status)}</span>
            <span class="chev" aria-hidden="true"></span>
          </div>
        </summary>

        <div class="r-body">
          <div>
            <div class="r-label">我的回答${item.version > 1 ? `（第 ${escapeHtml(item.version)} 次）` : ''}</div>
            <div class="feedback">${escapeHtml(item.answer)}</div>
            <p class="meta">送出時間：${escapeHtml(item.submittedAt)}</p>
            ${item.revisionNote || item.aiAdopted
              ? `<p class="meta">這次的修改：${escapeHtml(item.revisionNote || '（沒有寫）')}${item.aiAdopted ? `・${escapeHtml(item.aiAdopted)} AI 學習建議` : ''}</p>`
              : ''}
            ${item.instantFeedback
              ? `<div class="r-instant instant"><p class="instant-title">🤖 AI 學習建議</p>${feedbackHtml(item.instantFeedback)}</div>`
              : ''}
            ${classificationHtml(item)}
            ${document.querySelector('.q-card[data-id="' + item.questionId + '"]') && item.status !== '已通過'
              ? `<p class="meta"><button type="button" class="link-button" onclick="goToQuestion('${escapeHtml(item.questionId)}')">→ 回到這一題${item.status === '退回修改' ? '修改' : ''}</button></p>`
              : ''}
          </div>
          <div>${reviewHtml}</div>
        </div>
        ${historyHtml(item.history)}
      `;

      box.appendChild(div);
    });
  }


  /*
   * 課堂討論的分類。學生回覆這個分類符不符合自己想表達的。
   */
  function classificationHtml(item) {

    const c = item.classification;

    if (!c) return '';

    const id = escapeHtml(item.answerId);
    const head = `<p>在課堂討論中，你的回答被歸在「<b>${escapeHtml(c.categoryName)}</b>」${c.description ? '：' + escapeHtml(c.description) : ''}</p>`;

    if (c.agree) {
      return `<div class="cls-box" id="cls_${id}">${head}
        <p class="cls-done">你回覆：${escapeHtml(c.agree)}${c.note ? '・' + escapeHtml(c.note) : ''}
          <button type="button" class="link-button" onclick="this.closest('.cls-box').querySelector('.cls-actions').hidden = false; this.parentNode.hidden = true;">改回覆</button></p>
        ${classificationForm(item, true)}</div>`;
    }

    return `<div class="cls-box" id="cls_${id}">${head}
      <p class="cls-done" style="margin-bottom:6px">這個分類符合你想表達的嗎？</p>
      ${classificationForm(item, false)}</div>`;
  }


  function classificationForm(item, hidden) {

    const id = escapeHtml(item.answerId);
    const c = item.classification;

    return `<div class="cls-actions"${hidden ? ' hidden' : ''}>
        <input type="text" id="clsNote_${id}" maxlength="300" placeholder="想補充的話（選填）" value="${escapeHtml(c.note || '')}" aria-label="想補充的話">
        <button type="button" onclick="replyClassification('${id}', '符合')">符合</button>
        <button type="button" class="secondary" onclick="replyClassification('${id}', '不太符合')">不太符合</button>
        <span class="cls-msg" id="clsMsg_${id}" role="status"></span>
      </div>`;
  }


  function replyClassification(answerId, agree) {

    const identity = getIdentity();
    const msg = document.getElementById('clsMsg_' + answerId);
    const note = document.getElementById('clsNote_' + answerId);

    msg.textContent = '儲存中……';

    google.script.run
      .withSuccessHandler(function() {
        msg.textContent = '';
        loadMyResults();
      })
      .withFailureHandler(function(error) {
        msg.textContent = '沒有存到：' + error.message;
      })
      .confirmMyClassification({
        studentId: identity.studentId,
        name: identity.name,
        answerId: answerId,
        agree: agree,
        note: note ? note.value.trim() : '',
        courseCode: currentCourse ? currentCourse.code : ''
      });
  }


  function historyHtml(history) {

    if (!history || !history.length) return '';

    const items = history.slice().reverse().map(function(h) {
      const reviewed = h.teacherScore !== '' && h.teacherScore != null;
      return '<div class="history-item">' +
        '<div class="h-meta">第 ' + escapeHtml(h.version) + ' 次・' + escapeHtml(h.submittedAt) + (h.status ? '・' + escapeHtml(h.status) : '') + '</div>' +
        '<div class="h-text">' + escapeHtml(h.answer) + '</div>' +
        (h.revisionNote || h.aiAdopted ? '<div class="h-sub">這次的修改</div><div class="h-text">' + escapeHtml(h.revisionNote || '（沒有寫）') + (h.aiAdopted ? '・' + escapeHtml(h.aiAdopted) + ' AI 學習建議' : '') + '</div>' : '') +
        (h.instantFeedback ? '<div class="h-sub">AI 學習建議</div><div class="h-text">' + escapeHtml(h.instantFeedback) + '</div>' : '') +
        (reviewed || h.teacherFeedback
          ? '<div class="h-sub">老師' + (reviewed ? '給的分數 ' + escapeHtml(h.teacherScore) + '・' : '') + '評語</div><div class="h-text">' + escapeHtml(h.teacherFeedback || '（沒有評語）') + '</div>'
          : '') +
        '</div>';
    }).join('');

    return '<details class="history"><summary>我之前交過的 ' + history.length + ' 個版本</summary>' + items + '</details>';
  }


  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

</script>

<script>
  /* ===== 分頁切換（只負責畫面） ===== */
  (function() {

    const tabs = {
      questions: { tab: document.getElementById('tabQuestions'), panel: document.getElementById('panelQuestions') },
      results: { tab: document.getElementById('tabResults'), panel: document.getElementById('panelResults') }
    };

    function show(name) {
      Object.keys(tabs).forEach(function(key) {
        tabs[key].tab.setAttribute('aria-selected', String(key === name));
        tabs[key].panel.hidden = key !== name;
      });
    }

    tabs.questions.tab.addEventListener('click', function() { show('questions'); });

    // 切到作答紀錄時，已經填好資料就直接讀取
    tabs.results.tab.addEventListener('click', function() {
      show('results');
      const identity = getIdentity();
      if (identity.studentId && identity.name && currentCourse) loadMyResults();
    });

    document.getElementById('viewResultsButton').addEventListener('click', function() {
      show('results');
    });

    // 題目數量
    const list = document.getElementById('questionList');
    const count = document.getElementById('questionCount');

    new MutationObserver(function() {
      const n = list.querySelectorAll('.q-card').length;
      count.textContent = n;
      count.hidden = n === 0;
    }).observe(list, { childList: true });

  })();
</script>

</body>
</html>
