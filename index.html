<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 課堂</title>

  <script src="features.js"></script>

  <style>
    :root {
      --primary: #5268e8;
      --navy: #27366d;
      --purple: #7756dc;
      --green: #168c56;
      --orange: #df9225;
      --bg: #f4f7fc;
      --text: #253046;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 42px 20px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #5268e8, #7756dc);
    }

    header h1 { margin: 0 0 8px; }
    header p { margin: 0; }

    .container {
      max-width: 560px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .card {
      background: white;
      border-radius: 17px;
      padding: 24px;
      box-shadow: 0 7px 24px rgba(27, 39, 70, .07);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px 18px;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      background: var(--primary);
    }

    .menu-button:hover { filter: brightness(.92); }

    .menu-button:focus-visible {
      outline: 3px solid #f0b429;
      outline-offset: 3px;
    }

    .menu-button.navy { background: var(--navy); }
    .menu-button.purple { background: var(--purple); }
    .menu-button.green { background: var(--green); }
    .menu-button.orange { background: var(--orange); }

    .menu-button.soon {
      background: #d7dce6;
      color: #75809a;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  <h1>AI 課堂</h1>
  <p>人工智慧（小教）</p>
</header>

<main class="container">
  <nav class="card" id="menu"></nav>
</main>

<script>

  const features = Array.isArray(window.PLATFORM_FEATURES) ? window.PLATFORM_FEATURES : [];

  document.getElementById('menu').innerHTML = features.map(function(f) {

    const label = escapeHtml((f.icon ? f.icon + ' ' : '') + f.title);

    if (f.status === 'soon') {
      return '<span class="menu-button soon" aria-disabled="true">' + label + '（籌備中）</span>';
    }

    const target = f.newTab ? ' target="_blank" rel="noopener"' : '';

    return '<a class="menu-button ' + escapeHtml(f.color || 'primary') + '" href="' +
      escapeHtml(f.href) + '"' + target + '>' + label + '</a>';
  }).join('');

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

</script>

</body>
</html>
