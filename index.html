<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 課堂｜人工智慧（小教）</title>
  <meta name="description" content="人工智慧（小教）課程網站">

  <link rel="stylesheet" href="theme.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* ---------- 頂端列 ---------- */
    .topbar {
      background: var(--head);
      color: var(--head-text);
    }

    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      color: #fff;
      text-decoration: none;
    }

    .brand b {
      font-family: var(--serif);
      font-weight: 900;
      font-size: 22px;
      letter-spacing: .04em;
    }

    .brand span { color: var(--head-soft); font-size: 14px; }

    .topbar nav a {
      color: var(--head-soft);
      font-size: 14px;
      text-decoration: none;
    }

    .topbar nav a:hover { color: #fff; text-decoration: underline; }

    /* ---------- 主內容 ---------- */
    main {
      flex: 1;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 64px 28px 72px;
    }

    main h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 900;
      font-size: clamp(34px, 4.6vw, 52px);
      letter-spacing: .03em;
    }

    .lead {
      margin: 8px 0 40px;
      color: var(--ink-2);
      font-size: 17px;
    }

    /* 三扇門：每一扇用一個大字代表身分 */
    .doors {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .door {
      --c: var(--blue);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 360px;
      padding: 28px 28px 26px;
      border-radius: 6px;
      background: var(--c);
      color: #fff;
      text-decoration: none;
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .door.student   { --c: #2f5bd3; }
    .door.teacher   { --c: #1c6b4a; }
    .door.developer { --c: #22344f; }

    .door-glyph {
      position: absolute;
      top: 14px;
      right: 18px;
      font-family: var(--serif);
      font-weight: 900;
      font-size: 168px;
      line-height: 1;
      color: rgba(255, 255, 255, .16);
      transition: color .18s ease;
      pointer-events: none;
    }

    .door-name {
      font-family: var(--serif);
      font-weight: 900;
      font-size: 34px;
      letter-spacing: .06em;
      line-height: 1.2;
    }

    .door-hint {
      margin-top: 6px;
      font-size: 15px;
      color: rgba(255, 255, 255, .82);
    }

    .door-go {
      display: inline-block;
      margin-top: 22px;
      padding: 8px 18px;
      align-self: flex-start;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
    }

    a.door:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(16, 24, 40, .22); }
    a.door:hover .door-glyph { color: rgba(255, 255, 255, .28); }
    a.door:hover .door-go { background: #fff; color: var(--c); border-color: #fff; }

    /* ---------- 頁尾 ---------- */
    footer {
      border-top: 1px solid var(--line);
      color: var(--ink-2);
      font-size: 13px;
    }

    .footer-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      gap: 8px 16px;
      flex-wrap: wrap;
    }

    footer a { color: var(--ink-2); }

    @media (max-width: 860px) {
      main { padding: 36px 18px 48px; }
      .lead { margin-bottom: 26px; }
      .doors { grid-template-columns: 1fr; gap: 12px; }
      .door { min-height: 0; padding: 22px 22px 20px; }
      .door-glyph { top: 50%; transform: translateY(-50%); font-size: 104px; }
      .door-name { font-size: 26px; }
      .door-go { margin-top: 14px; }
      .topbar-inner, .footer-inner { padding-left: 18px; padding-right: 18px; }
      .brand span { display: none; }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><b>AI 課堂</b><span>人工智慧（小教）</span></a>
    <nav aria-label="外部連結">
      <a href="https://moodle3.ntnu.edu.tw/" target="_blank" rel="noopener">師大 Moodle</a>
    </nav>
  </div>
</header>

<main>
  <h1>歡迎來到 AI 課堂</h1>
  <p class="lead">請選擇你的身分。</p>

  <div class="doors">
    <a class="door student" href="student.html">
      <span class="door-glyph" aria-hidden="true">學</span>
      <span class="door-name">學生</span>
      <span class="door-hint">回答老師的問題、查看回饋</span>
      <span class="door-go">進入</span>
    </a>

    <a class="door teacher" href="teacher.html">
      <span class="door-glyph" aria-hidden="true">教</span>
      <span class="door-name">教師</span>
      <span class="door-hint">需要輸入教師密碼</span>
      <span class="door-go">登入</span>
    </a>

    <a class="door developer" href="dev.html">
      <span class="door-glyph" aria-hidden="true">研</span>
      <span class="door-name">開發者</span>
      <span class="door-hint">系統架構與原始碼</span>
      <span class="door-go">進入</span>
    </a>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span>© 2026 人工智慧（小教）課程</span>
    <a href="https://github.com/chiaying1230/aiclassroom" target="_blank" rel="noopener">GitHub</a>
  </div>
</footer>

</body>
</html>
