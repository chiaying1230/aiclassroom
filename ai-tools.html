<html lang="zh-Hant">
<head>
<base target="_blank">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教師 AI 工具研習筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9eeec;
    --paper: #ffffff;
    --ink: #1c2623;
    --muted: #56635f;
    --line: #cbd5d1;
    --board: #23413a;
    --chalk: #eef3ea;
    --c-overview: #56635f;
    --c-perplexity: #2c6e8f;
    --c-diffit: #7a4fa0;
    --c-napkin: #a8750c;
    --c-magic: #b2445a;
    --c-brisk: #3c7d3e;
    --c-flow: #23413a;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --serif: "Noto Serif TC", "PMingLiU", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.8;
  }
  a { color: var(--accent, var(--c-perplexity)); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #e2b93b; outline-offset: 2px; }
  button { font: inherit; cursor: pointer; }

  /* 刊頭 */
  .mast { background: var(--board); color: var(--chalk); }
  .mast-inner { max-width: 960px; margin: 0 auto; padding: 20px 24px 36px; }
  .site-home { display: inline-block; color: #c9d6cf; font-size: 15px; margin-bottom: 18px; text-decoration: none; }
  .site-home:hover { color: #fff; text-decoration: underline; }
  .mast h1 {
    font-family: var(--serif); font-weight: 900; margin: 0;
    font-size: clamp(30px, 6vw, 52px); line-height: 1.2; letter-spacing: .02em;
  }
  .mast p { margin: 12px 0 0; max-width: 40em; color: #c9d6cf; }
  .mast .home-link {
    background: none; border: 0; color: inherit; padding: 0; text-align: left;
  }

  main { max-width: 960px; margin: 0 auto; padding: 32px 24px 64px; }

  /* 首頁：流程 */
  .flow { margin: 0 0 40px; }
  .flow h2, .list h2 { font-family: var(--serif); font-size: 22px; margin: 0 0 14px; }
  .flow ol {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    counter-reset: step;
  }
  .flow li button {
    width: 100%; height: 100%; text-align: left;
    background: var(--paper); border: 1px solid var(--line); border-top: 5px solid var(--accent);
    border-radius: 4px; padding: 12px 12px 14px; color: var(--ink);
  }
  .flow li button:hover { background: #f7faf9; }
  .flow .n { font-family: var(--serif); font-weight: 900; font-size: 26px; color: var(--accent); line-height: 1; }
  .flow .t { display: block; font-weight: 700; margin-top: 6px; }
  .flow .d { display: block; font-size: 14px; color: var(--muted); line-height: 1.5; }

  /* 首頁：文章列表 */
  .list ul { list-style: none; margin: 0; padding: 0; }
  .list li + li { margin-top: 12px; }
  .post-link {
    display: grid; grid-template-columns: 8px 1fr; width: 100%; text-align: left;
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
    padding: 0; color: var(--ink); overflow: hidden;
  }
  .post-link:hover .pl-title { text-decoration: underline; text-underline-offset: 4px; }
  .post-link .bar { background: var(--accent); }
  .post-link .body { padding: 16px 20px 18px; }
  .pl-meta { font-size: 14px; color: var(--muted); }
  .pl-meta b { color: var(--accent); font-weight: 700; }
  .pl-title { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 2px 0 4px; line-height: 1.45; }
  .pl-sum { margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.7; }

  /* 文章 */
  article { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .tab { background: var(--accent); color: #fff; padding: 6px 24px; font-size: 14px; font-weight: 500; }
  .art-inner { max-width: 760px; margin: 0 auto; padding: 28px 24px 40px; }
  .back { background: none; border: 0; color: var(--muted); padding: 0; margin-bottom: 18px; font-size: 15px; }
  .back:hover { color: var(--ink); text-decoration: underline; }
  article h1 { font-family: var(--serif); font-size: clamp(26px, 4.6vw, 36px); line-height: 1.35; margin: 0 0 10px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 15px; color: var(--muted); margin: 0 0 24px; padding: 0; list-style: none; }
  .facts b { color: var(--ink); font-weight: 500; }
  article h2 {
    font-family: var(--serif); font-size: 22px; margin: 36px 0 10px;
    padding-left: 12px; border-left: 5px solid var(--accent); line-height: 1.4;
  }
  article h3 { font-size: 18px; margin: 24px 0 6px; }
  article p, article li { max-width: 40em; }
  article ul { padding-left: 1.3em; }
  .lead { font-size: 18.5px; }
  .tool-link {
    display: inline-block; margin: 6px 0 4px; padding: 8px 16px; border-radius: 4px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 500;
  }
  .tool-link:hover { filter: brightness(1.1); }
  .note { background: #f4f6f5; border-left: 4px solid var(--muted); padding: 12px 16px; margin: 18px 0; border-radius: 0 4px 4px 0; }
  .note.warn { background: #fdf4ec; border-left-color: #c26a1b; }
  .prompt { background: #f4f6f5; border: 1px dashed var(--line); padding: 14px 16px; border-radius: 4px; margin: 12px 0; }

  .table-wrap { overflow-x: auto; margin: 12px 0 8px; border: 1px solid var(--line); border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 15.5px; line-height: 1.6; }
  th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { background: #f4f6f5; font-weight: 700; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td:first-child { white-space: nowrap; color: var(--accent); font-weight: 700; }
  table.plain td:first-child { color: var(--ink); font-weight: 500; }

  .check label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .check input { width: 20px; height: 20px; margin-top: 5px; accent-color: var(--accent); flex: none; }
  .progress { font-weight: 700; color: var(--accent); margin-top: 10px; }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
  .pager button {
    background: #f4f6f5; border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px;
    text-align: left; color: var(--ink); line-height: 1.5;
  }
  .pager button:hover { background: #eaefed; }
  .pager .next { text-align: right; grid-column: 2; }
  .pager small { display: block; color: var(--muted); }
  .share { margin-top: 28px; font-size: 14px; color: var(--muted); }
  .share input { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; margin-top: 4px; color: var(--ink); background: #fafbfb; }

  footer { max-width: 960px; margin: 0 auto; padding: 0 24px 40px; font-size: 14px; color: var(--muted); }

  @media (max-width: 760px) {
    body { font-size: 16px; }
    .flow ol { grid-template-columns: 1fr; }
    .flow li button { display: grid; grid-template-columns: 40px 1fr; column-gap: 6px; border-top-width: 1px; border-left: 5px solid var(--accent); }
    .flow .n { grid-row: span 2; align-self: center; }
    .flow .t { margin-top: 0; }
    .pager { grid-template-columns: 1fr; }
    .pager .next { grid-column: 1; }
  }
  @media (prefers-reduced-motion: no-preference) {
    #view { animation: none; }
    #view.enter { animation: fade .25s ease-out; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
</head>

{

var FLOW = ['perplexity', 'diffit', 'napkin', 'magicschool', 'brisk'];

  perplexity: ['查資料', 'Perplexity'],
  diffit: ['分級改寫', 'Diffit'],
  napkin: ['做成圖解', 'Napkin AI'],
  magicschool: ['設計規準', 'MagicSchool'],
  brisk: ['批改回饋', 'Brisk Teaching']
};

/* ===== 畫面 ===== */
var view = document.getElementById('view');

function findPost(id) {
  for (var i = 0; i < POSTS.length; i++) if (POSTS[i].id === id) return i;
  return -1;
}

function renderHome() {
  var flow = '<section class="flow"><h2>一個單元的備課流程</h2><ol>';
  FLOW.forEach(function (id, i) {
    var p = POSTS[findPost(id)];
    flow += '<li><button type="button" style="--accent:' + p.color + '" onclick="go(\'' + id + '\')">'
      + '<span class="n">' + (i + 1) + '</span>'
      + '<span class="t">' + FLOW_TEXT[id][0] + '</span>'
      + '<span class="d">' + FLOW_TEXT[id][1] + '</span></button></li>';
  });
  flow += '</ol></section>';

  var list = '<section class="list"><h2>全部文章</h2><ul>';
  POSTS.forEach(function (p) {
    list += '<li><button type="button" class="post-link" style="--accent:' + p.color + '" onclick="go(\'' + p.id + '\')">'
      + '<span class="bar"></span><span class="body">'
      + '<span class="pl-meta"><b>' + p.tab + '</b>　約 ' + p.time + '</span>'
      + '<span class="pl-title" style="display:block">' + p.title + '</span>'
      + '<span class="pl-sum" style="display:block">' + p.summary + '</span>'
      + '</span></button></li>';
  });
  list += '</ul></section>';

  view.innerHTML = flow + list;
  document.title = '教師 AI 工具研習筆記';
}

function renderPost(i) {
  var p = POSTS[i];
  var prev = POSTS[i - 1], next = POSTS[i + 1];
  var pager = '<nav class="pager" aria-label="上一篇與下一篇">';
  if (prev) pager += '<button type="button" onclick="go(\'' + prev.id + '\')"><small>上一篇</small>' + prev.title + '</button>';
  if (next) pager += '<button type="button" class="next" onclick="go(\'' + next.id + '\')"><small>下一篇</small>' + next.title + '</button>';
  pager += '</nav>';

  view.innerHTML = '<article style="--accent:' + p.color + '">'
    + '<div class="tab">' + p.tab + '</div>'
    + '<div class="art-inner">'
    + '<button type="button" class="back" onclick="go(\'\')">回到文章列表</button>'
    + '<h1>' + p.title + '</h1>'
    + '<ul class="facts"><li>工作情境：<b>' + p.scene + '</b></li><li>建議時間：<b>' + p.time + '</b></li></ul>'
    + p.body
    + pager
    + '<div class="share"><label>本篇分享網址（點一下即可全選複製）'
    + '<input type="text" readonly value="' + SITE_URL + '?post=' + p.id + '" onclick="this.select()"></label></div>'
    + '</div></article>';
  document.title = p.title + '｜教師 AI 工具研習筆記';

  if (p.id === 'checklist') bindChecklist();
}

function bindChecklist() {
  var boxes = document.querySelectorAll('#checklist input');
  var out = document.getElementById('progress');
  function update() {
    var n = 0;
    boxes.forEach(function (b) { if (b.checked) n++; });
    out.textContent = '已完成 ' + n + '／' + boxes.length + ' 項' + (n === boxes.length ? '，全部完成！' : '');
  }
  boxes.forEach(function (b) { b.addEventListener('change', update); });
}

function render(id) {
  var i = findPost(id || '');
  if (i >= 0) renderPost(i); else renderHome();
  view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
  window.scrollTo(0, 0);
}

/* ===== 網址與上一頁 =====
   點文章時網址會變成 ai-tools.html?post=文章代號，
   可以直接分享，瀏覽器的上一頁也能用。 */
function go(id) {
  render(id);
  try {
    history.pushState({ post: id || '' }, '', id ? '?post=' + id : location.pathname);
  } catch (e) {}
}

window.addEventListener('popstate', function (e) {
  render(e.state ? e.state.post : new URLSearchParams(location.search).get('post'));
});

render(new URLSearchParams(location.search).get('post'));
</script>
